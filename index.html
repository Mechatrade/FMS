<style>
  html, body, #root { height: 100%; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background:#F4EFE4; color:#1C1C1A; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8d2c2; border-radius: 8px; }
  .nav-link.active { background: #1F3A2E; color: #fff; }
  .nav-link.active svg { color: #fff; }
  .nav-children { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
  .nav-group.expanded > .nav-children { max-height: 600px; }
  .nav-chevron { transition: transform .2s ease; }
  .nav-group.expanded .nav-chevron { transform: rotate(180deg); }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(2px);} to {opacity:1; transform:translateY(0);} }
  [data-page]:not(.active-page) { display:none; }

  /* Card + primary button — referenced everywhere but never actually
     defined until now. */
  .card {
    background: #fff;
    border: 1px solid #E5E7EB;
    border-radius: 0.5rem;
    box-shadow: 0 1px 3px 0 rgba(28,28,26,0.08), 0 1px 2px -1px rgba(28,28,26,0.06);
  }
  .btn-primary, .btn-glass-sm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    font-weight: 600;
    color: #15281E;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 14px -2px rgba(31,58,46,0.18), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: all .2s ease;
  }
  .btn-primary { border-radius: 0.5rem; padding: 0.625rem 1rem; font-size: 0.875rem; }
  .btn-glass-sm { border-radius: 0.375rem; padding: 0.375rem 0.75rem; font-size: 0.75rem; box-shadow: 0 3px 10px -2px rgba(31,58,46,0.16), inset 0 1px 0 rgba(255,255,255,0.6); }
  .btn-primary:hover, .btn-glass-sm:hover {
    background: rgba(255,255,255,0.72);
    box-shadow: 0 6px 18px -2px rgba(31,58,46,0.24), inset 0 1px 0 rgba(255,255,255,0.7);
    transform: translateY(-1px);
  }
  .btn-primary:active, .btn-glass-sm:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px -2px rgba(31,58,46,0.18), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .btn-primary:disabled, .btn-glass-sm:disabled {
    opacity: 0.5; cursor: not-allowed; transform: none;
  }
  .nav-badge {
    background: #ef4444; color: #fff; font-size: 10px; font-weight: 700;
    line-height: 1; border-radius: 9999px; padding: 3px 6px; margin-left: auto;
  }

  /* Voucher stamps */
  .voucher-stamp { pointer-events: none; user-select: none; }

  @media print {
    #sidebar, header, #sidebar-backdrop, .print\:hidden { display: none !important; }
    body { background: #fff !important; }
    main#content { padding: 0 !important; }
    #voucher-print-area { box-shadow: none !important; border: 1px solid #999 !important; }
  }
</style>

/* ==========================================================================
   HELPERS
   ========================================================================== */
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function icon(name, cls = "w-5 h-5") {
  return `<i data-lucide="${name}" class="${cls}"></i>`;
}
function refreshIcons() { if (window.lucide) lucide.createIcons(); }
function findNavByPath(path) {
  for (const item of NAV) {
    if (item.path === path) return { item, child: null };
    if (item.children) {
      const child = item.children.find(c => c.path === path);
      if (child) return { item, child };
    }
  }
  return null;
}
function canAccess(topPath) {
  if (!currentProfile) return true;
  const perms = ROLE_PERMISSIONS[currentProfile.role] || {};
  return perms[topPath] !== false;
}

        showLoginError(friendlyAuthError(e));
      }
    });
  }

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (isSignup) { handleSignUp(); } else { handleSignIn(); }
  });

async function handleSignIn() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const remember = document.getElementById('login-remember').checked;
  const btn = document.getElementById('login-submit');
  const btnText = document.getElementById('login-submit-text');

  if (!firebaseReady) { showLoginError('Firebase is not configured. See the firebaseConfig object near the top of this file.'); return; }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged will take over rendering
  } catch (err) {
    showLoginError(friendlyAuthError(err));
    btn.disabled = false;
    btnText.textContent = 'Sign In';
  }
}

async function handleSignUp() {
  const name = document.getElementById('login-name').value.trim();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const confirmPassword = document.getElementById('login-password-confirm').value;
  const btn = document.getElementById('login-submit');
  const btnText = document.getElementById('login-submit-text');

  if (!firebaseReady) { showLoginError('Firebase is not configured. See the firebaseConfig object near the top of this file.'); return; }
  if (password !== confirmPassword) { showLoginError('Passwords do not match.'); return; }
  if (password.length < 6) { showLoginError('Password must be at least 6 characters.'); return; }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    const isFirstUser = await isFirstAccount();
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: name || email.split('@')[0],
      email,
      role: isFirstUser ? 'system_admin' : 'operations',
      department: isFirstUser ? 'Administration' : 'Operations',
      isActive: true,
      createdAt: serverTimestamp(),
    });
    // onAuthStateChanged will take over rendering; ensureUserProfile will
    // find this doc already created and just use it.
  } catch (err) {
    showLoginError(friendlyAuthError(err));
    btn.disabled = false;
    btnText.textContent = 'Create Account';
  }
}

function showLoginError(msg, isSuccess = false) {
  const box = document.getElementById('login-error');
  if (!box) return;
  box.textContent = msg;
  box.classList.remove('hidden');
  if (isSuccess) {
    box.classList.remove('bg-red-50','border-red-200','text-red-700');
    box.classList.add('bg-green-50','border-green-200','text-green-700');
  }
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : '';
  const map = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-disabled': 'This account has been disabled.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Please wait and try again.',
    'auth/email-already-in-use': 'An account with that email already exists. Try signing in instead.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Firebase rejected the API key in firebaseConfig. Double-check you copied it exactly from Project Settings > General > Your apps, with no missing characters or quotes.',
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

async function refreshApprovalsBadge() {
  const badgeEl = document.getElementById('nav-badge-approvals');
  if (!badgeEl || !canApproveDisbursements()) return;
  try {
    const vouchers = await fetchFinanceCollection('disbursementVouchers');
    const count = vouchers.filter(v => v.status === 'Pending').length;
    badgeEl.innerHTML = count > 0 ? `<span class="nav-badge">${count}</span>` : '';

function applyUserToChrome() {
  const name = (currentProfile && currentProfile.name) || (currentUser && currentUser.email) || 'User';
  const role = currentProfile ? roleLabel(currentProfile.role) : '—';
  const initials = name.split(' ').map(p => p[0]).filter(Boolean).slice(0,2).join('').toUpperCase() || '?';
  ['sidebar-username','header-username'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = name; });
  ['sidebar-userrole','header-userrole'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = role; });

const TEAM_ROLES = ['system_admin', 'finance_manager', 'custodian', 'procurement_staff', 'operations'];
function roleLabel(role) {
  const map = {
    system_admin: 'System Admin', finance_manager: 'Finance Manager', custodian: 'Custodian',
    procurement_staff: 'Procurement Staff', operations: 'Operations',
    // Legacy
    super_admin: 'System Admin (legacy)', admin: 'System Admin (legacy)',
    management: 'Finance Manager (legacy)', finance_staff: 'Operations (legacy)',

function wireShellEvents() {
  document.getElementById('sidebar-toggle')?.addEventListener('click', () => toggleSidebar(true));
  document.getElementById('sidebar-backdrop')?.addEventListener('click', () => toggleSidebar(false));

  document.getElementById('sidebar-signout')?.addEventListener('click', handleSignOut);
  document.getElementById('header-signout')?.addEventListener('click', handleSignOut);

  document.getElementById('header-profile-btn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('header-profile-menu')?.classList.toggle('hidden');
  });
  document.addEventListener('click', () => document.getElementById('header-profile-menu')?.classList.add('hidden'));

  document.querySelectorAll('[data-nav-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-nav-toggle');
      const item = NAV.find(n => n.path === key);
      if (item && item.children) {
        const group = document.querySelector(`.nav-group[data-nav-key="${key}"]`);

  document.querySelectorAll('[data-route]').forEach(n => {
    n.addEventListener('click', (e) => {
      e.preventDefault();
      navigateTo(n.getAttribute('data-route'));
    });
  });
}

/* ==========================================================================
   ROUTING + PAGE CONTENT
   ========================================================================== */
function navigateTo(path) {
  window.location.hash = `#/${path}`;
}

function currentPathFromHash() {
  const h = window.location.hash || '#/dashboard';
  return h.replace(/^#\//, '') || 'dashboard';
}

function buildBreadcrumb(topItem, childItem) {
  const parts = [];
  if (topItem) parts.push(topItem.name);
  if (childItem && childItem.name !== (topItem && topItem.name)) parts.push(childItem.name);
  const bc = document.getElementById('breadcrumb');
  if (bc) bc.innerHTML = parts.map((p, i) =>
    `<span class="${i === parts.length - 1 ? 'text-charcoal font-medium' : ''}">${p}</span>`
  ).join(' <span class="text-borderc">/</span> ');
}

function renderRoute() {
  if (!currentUser) return; // guarded elsewhere
  const path = currentPathFromHash();

  // Standby / future module check (not in NAV, reached only via config)
  const standbyKey = Object.keys(STANDBY_MODULES).find(k => path === `future/${k}`);
  if (standbyKey) {
    renderModuleNotAvailable(STANDBY_MODULES[standbyKey].name);
    return;
  }

  // Dynamic route: viewing a single Client PO (read-only)
  if (path.startsWith('client-orders/view/')) {
    if (!canAccess('client-orders')) { renderNoAccess('Client Orders'); buildBreadcrumb(null, null); return; }
    const poId = path.substring('client-orders/view/'.length);
    setActiveNav('client-orders/open-pos', NAV.find(n => n.path === 'client-orders')); // best-effort highlight
    buildBreadcrumb(NAV.find(n => n.path === 'client-orders'), { name: 'View Client PO' });
    renderClientPOViewPage(poId);
    return;
  }

  // Dynamic route: editing a single Client PO (not in NAV, has an id in the path)
  if (path.startsWith('client-orders/edit/')) {
    if (!canAccess('client-orders')) { renderNoAccess('Client Orders'); buildBreadcrumb(null, null); return; }
    const poId = path.substring('client-orders/edit/'.length);
    setActiveNav('client-orders/open-pos', NAV.find(n => n.path === 'client-orders')); // best-effort highlight
    buildBreadcrumb(NAV.find(n => n.path === 'client-orders'), { name: 'Edit Client PO' });
    renderClientPOEditPage(poId);
    return;
  }

  // Dynamic Finance routes (not in NAV — reached via buttons/links on the Finance pages)
  const financeDynamicRoutes = {
    'finance/ar/new': { fn: renderNewAREntryPage, label: 'New Manual AR Entry', highlight: 'finance/accounts-receivable' },
    'finance/ap/new': { fn: renderNewAPEntryPage, label: 'New Payable', highlight: 'finance/accounts-payable' },
    'finance/expenses/new': { fn: renderNewExpensePage, label: 'New Expense', highlight: 'finance/expenses' },
    'finance/tax/new': { fn: renderNewTaxPage, label: 'New Tax Record', highlight: 'finance/tax' },
  };
  if (financeDynamicRoutes[path]) {
    if (!canAccess('finance')) { renderNoAccess('Finance'); buildBreadcrumb(null, null); return; }
    const route = financeDynamicRoutes[path];
    setActiveNav(route.highlight, NAV.find(n => n.path === 'finance'));
    buildBreadcrumb(NAV.find(n => n.path === 'finance'), { name: route.label });
    route.fn();
    return;
  }
  if (path.startsWith('finance/ar/payment/')) {
    if (!canAccess('finance')) { renderNoAccess('Finance'); buildBreadcrumb(null, null); return; }
    const arId = path.substring('finance/ar/payment/'.length);
    setActiveNav('finance/accounts-receivable', NAV.find(n => n.path === 'finance'));
    buildBreadcrumb(NAV.find(n => n.path === 'finance'), { name: 'Record Payment' });
    renderARPaymentPage(arId);
    return;
  }
  // AP/Expense/Tax payments now go through Disbursement Vouchers
  // (see disbursement/vouchers/new/... routes below) — no direct-pay route.

  // Dynamic Procurement routes (not in NAV — reached via buttons/links on the Procurement pages)
  const procurementEditRoutes = [
    { prefix: 'procurement/suppliers/edit/', fn: renderEditSupplierPage, highlight: 'procurement/suppliers', label: 'Edit Supplier' },
    { prefix: 'procurement/purchase-requests/edit/', fn: renderEditPRPage, highlight: 'procurement/purchase-requests', label: 'Edit Purchase Request' },
    { prefix: 'procurement/supplier-pos/edit/', fn: renderEditSupplierPOPage, highlight: 'procurement/supplier-pos', label: 'Edit Supplier PO' },
  ];
  for (const r of procurementEditRoutes) {
    if (path.startsWith(r.prefix)) {
      if (!canAccess('procurement')) { renderNoAccess('Procurement'); buildBreadcrumb(null, null); return; }
      const id = path.substring(r.prefix.length);
      setActiveNav(r.highlight, NAV.find(n => n.path === 'procurement'));
      buildBreadcrumb(NAV.find(n => n.path === 'procurement'), { name: r.label });
      r.fn(id);
      return;
    }
  }
  const procurementNewRoutes = {
    'procurement/suppliers/new': { fn: renderNewSupplierPage, highlight: 'procurement/suppliers', label: 'New Supplier' },
    'procurement/purchase-requests/new': { fn: renderNewPRPage, highlight: 'procurement/purchase-requests', label: 'New Purchase Request' },
    'procurement/supplier-pos/new': { fn: renderNewSupplierPOPage, highlight: 'procurement/supplier-pos', label: 'New Supplier PO' },
  };
  if (procurementNewRoutes[path]) {
    if (!canAccess('procurement')) { renderNoAccess('Procurement'); buildBreadcrumb(null, null); return; }
    const r = procurementNewRoutes[path];
    setActiveNav(r.highlight, NAV.find(n => n.path === 'procurement'));
    buildBreadcrumb(NAV.find(n => n.path === 'procurement'), { name: r.label });
    r.fn();
    return;
  }

function setActiveNav(path, topItem) {
  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
  const link = document.querySelector(`[data-route="${path}"]`);
  if (link) link.classList.add('active');
  // also highlight the group toggle button if this is a top-level-only item (Dashboard)
  if (!topItem.children) {
    const btn = document.querySelector(`[data-nav-toggle="${topItem.path}"]`);
    if (btn) btn.classList.add('active');
  }
  // accordion: expand the group containing the current route, collapse the rest
  document.querySelectorAll('.nav-group').forEach(g => {
    g.classList.toggle('expanded', g.getAttribute('data-nav-key') === topItem.path && !!topItem.children);
  });
}

function formatCurrency(amount) {
  const n = Number(amount) || 0;
  return '₱ ' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDate(value) {
  if (!value) return '—';
  const d = typeof value === 'string' ? new Date(value + 'T00:00:00') : value;
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function calcCommitmentDate(dateReceivedISO, leadTimeValue, leadTimeUnit) {
  if (!dateReceivedISO || !leadTimeValue) return '';
  const days = leadTimeUnit === 'weeks' ? Number(leadTimeValue) * 7 : Number(leadTimeValue);
  if (isNaN(days)) return '';
  const d = new Date(dateReceivedISO + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function isOverdue(po) {
  if (!po.commitmentDeliveryDate) return false;
  if (['Complete Delivery', 'Ready for Billing', 'Cancelled'].includes(po.status)) return false;
  return po.commitmentDeliveryDate < todayISO();
}
function escapeAttr(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

let crmSuppliersCache = null;
function wireCRMSupplierSearch() {
  const input = document.getElementById('crm-supplier-search');
  const resultsBox = document.getElementById('crm-supplier-results');
  const statusEl = document.getElementById('crm-supplier-status');

  input.addEventListener('input', async () => {
    const query = input.value.trim().toLowerCase();
    if (!query) { resultsBox.classList.add('hidden'); statusEl.textContent = ''; return; }

    if (!crmSuppliersCache) {
      statusEl.textContent = 'Searching CRM...';
      try {
        crmSuppliersCache = await fetchAllCRMSuppliers();
        statusEl.textContent = '';
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Could not reach CRM. Check that the CRM-v2 Firestore rule for suppliers has been updated.';
        return;
      }
    }

    const matches = crmSuppliersCache.filter(s => (s.name || '').toLowerCase().includes(query)).slice(0, 8);
    if (!matches.length) {
      resultsBox.innerHTML = `<div class="px-3 py-2 text-xs text-muted">No matching suppliers in CRM.</div>`;
      resultsBox.classList.remove('hidden');
      return;
    }
    resultsBox.innerHTML = matches.map(s => `
      <button type="button" data-crm-supplier-id="${s.id}" class="w-full text-left px-3 py-2 text-sm hover:bg-cream border-b border-borderc last:border-0">
        <span class="font-medium text-charcoal">${escapeAttr(s.name)}</span>
        ${s.contactPerson ? `<span class="text-xs text-muted"> — ${escapeAttr(s.contactPerson)}</span>` : ''}
      </button>`).join('');
    resultsBox.classList.remove('hidden');

    resultsBox.querySelectorAll('[data-crm-supplier-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const supplier = crmSuppliersCache.find(s => s.id === btn.getAttribute('data-crm-supplier-id'));
        if (supplier) fillSupplierFormFromCRM(supplier);
        resultsBox.classList.add('hidden');
        input.value = supplier ? supplier.name : '';
      });
    });
  });

  document.addEventListener('click', (e) => {
    if (!resultsBox.contains(e.target) && e.target !== input) resultsBox.classList.add('hidden');
  });
}
function fillSupplierFormFromCRM(s) {
  const setVal = (id, value) => { const el = document.getElementById('field-' + id); if (el && value != null) el.value = value; };
  setVal('name', s.name);
  setVal('contactPerson', s.contactPerson);
  setVal('phone', s.phone);
  setVal('crmSupplierId', s.id);

  const noteParts = [`Pulled from CRM supplier record${s.department ? ' (Department: ' + s.department + ')' : ''}.`];
  if (s.lastCanvassDate) noteParts.push(`Last canvassed in CRM: ${s.lastCanvassDate}.`);
  setVal('notes', noteParts.join(' '));

  const statusEl = document.getElementById('crm-supplier-status');
  if (statusEl) statusEl.textContent = 'Filled from CRM — Category, Email, Address, and Payment Terms aren\'t in CRM yet, so set those manually.';
}

  const span = opts.span2 ? 'sm:col-span-2' : '';
  return `

      ${opts.hint ? `<p class="text-xs text-muted mt-1.5">${opts.hint}</p>` : ''}

}

function wirePOFormAutoCalc() {
  const recalc = () => {
    const dateReceived = document.getElementById('field-dateReceived')?.value;
    const leadTimeValue = document.getElementById('field-leadTimeValue')?.value;
    const leadTimeUnit = document.getElementById('field-leadTimeUnit')?.value;
    const commitField = document.getElementById('field-commitmentDeliveryDate');
    if (commitField && dateReceived && leadTimeValue) {
      commitField.value = calcCommitmentDate(dateReceived, leadTimeValue, leadTimeUnit);
    }
  };
  ['field-dateReceived', 'field-leadTimeValue', 'field-leadTimeUnit'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', recalc);
  });
}
function paymentTermsSummary(type, advanceAmount, days, customDays) {
  if (type === 'Advance Payment') {
    return `Advance Payment${advanceAmount ? ' — ' + formatCurrency(advanceAmount) : ''}`;
  }
  if (type === 'COD') return 'COD';
  if (type === 'Terms') {
    const daysLabel = days === 'Custom' ? (customDays ? `Custom — ${customDays} days` : 'Custom') : days;
    return daysLabel ? `Terms — ${daysLabel}` : 'Terms';
  }
  return '';
}
function readPOFormValues() {
  const val = (id) => { const el = document.getElementById('field-' + id); return el ? el.value.trim() : ''; };
  const paymentTermsType = val('paymentTermsType');
  const advancePaymentAmount = val('advancePaymentAmount') ? Number(val('advancePaymentAmount')) : null;
  const paymentTermsDays = val('paymentTermsDays');
  const customPaymentDays = val('customPaymentDays') ? Number(val('customPaymentDays')) : null;
  return {
    clientName: val('clientName'),
    clientPONumber: val('clientPONumber'),
    poType: val('poType'),
    priority: val('priority') || 'Normal',
    projectDescription: val('projectDescription'),
    poAmount: Number(val('poAmount')) || 0,
    dateReceived: val('dateReceived'),
    poDateForwarded: val('poDateForwarded'),
    leadTimeValue: val('leadTimeValue') ? Number(val('leadTimeValue')) : null,
    leadTimeUnit: val('leadTimeUnit') || 'days',
    commitmentDeliveryDate: val('commitmentDeliveryDate'),
    clientContactPerson: val('clientContactPerson'),
    clientContactNumber: val('clientContactNumber'),
    salesPerson: val('salesPerson'),
    salesInvoiceNo: val('salesInvoiceNo'),
    crmControlNumber: val('crmControlNumber'),
    deliveryReceiptNo: val('deliveryReceiptNo'),
    collectionReceiptNo: val('collectionReceiptNo'),
    paymentTermsType,
    advancePaymentAmount,
    paymentTermsDays,
    customPaymentDays,
    paymentTerms: paymentTermsSummary(paymentTermsType, advancePaymentAmount, paymentTermsDays, customPaymentDays),
    warranty: val('warranty'),
    poDocumentReference: val('poDocumentReference'),
    notes: val('notes'),
  };
}

function wirePaymentTermsField() {
  const typeSel = document.getElementById('field-paymentTermsType');
  if (!typeSel) return;
  const daysSel = document.getElementById('field-paymentTermsDays');
  const syncType = () => {
    document.getElementById('pt-advance-wrap').classList.toggle('hidden', typeSel.value !== 'Advance Payment');
    document.getElementById('pt-days-wrap').classList.toggle('hidden', typeSel.value !== 'Terms');
  };
  const syncDays = () => {
    document.getElementById('pt-custom-wrap').classList.toggle('hidden', !daysSel || daysSel.value !== 'Custom');
  };
  typeSel.addEventListener('change', syncType);
  if (daysSel) daysSel.addEventListener('change', syncDays);
}

      const newStatus = sel.value;
      sel.disabled = true;
      try {
        await updateClientPO(id, { status: newStatus });
        await onChangeReload();
      } catch (e) {
        console.error(e);
        alert('Could not update status. Please try again.');
        sel.disabled = false;
      }
    });
  });
}

function wireCRMPullButton() {
  const btn = document.getElementById('crm-pull-btn');
  const btnText = document.getElementById('crm-pull-btn-text');
  const resultBox = document.getElementById('crm-pull-result');
  let lastMatch = null;

  btn.addEventListener('click', async () => {
    const controlNo = document.getElementById('crm-pull-input').value.trim();
    resultBox.innerHTML = '';
    lastMatch = null;
    if (!controlNo) {
      resultBox.innerHTML = `<p class="text-xs text-red-600">Enter a Control No. first.</p>`;
      return;
    }
    btn.disabled = true;
    btnText.innerHTML = spinnerHtml();
    try {
      const so = await fetchCRMSalesOrderByControlNo(controlNo);
      if (!so) {
        resultBox.innerHTML = `<p class="text-xs text-red-600">No Sales Order found with that Control No.</p>`;
      } else {
        lastMatch = so;
        resultBox.innerHTML = crmPullResultHtml(so);
        refreshIcons();
        document.getElementById('crm-pull-confirm').addEventListener('click', () => {
          fillPOFormFromCRM(lastMatch);
        });
      }
    } catch (e) {
      console.error(e);
      resultBox.innerHTML = `<p class="text-xs text-red-600">Could not reach CRM. Check that the CRM-v2 Firestore rule for salesorders has been updated, and that the Control No. is correct.</p>`;
    }
    btn.disabled = false;
    btnText.textContent = 'Search CRM';
  });
}

function fillPOFormFromCRM(so) {
  const setVal = (id, value) => { const el = document.getElementById('field-' + id); if (el && value != null) el.value = value; };

  setVal('clientName', so.billedTo && so.billedTo.name);
  setVal('clientPONumber', so.poNumber);
  setVal('dateReceived', so.poDate);
  setVal('crmControlNumber', so.controlNo);
  setVal('clientContactPerson', so.billedTo && so.billedTo.contactName);
  setVal('clientContactNumber', so.billedTo && so.billedTo.phone);
  setVal('poAmount', so.total);

  // CRM's Sales Order only stores the "Terms" side of payment terms
  // (paymentTermsDays / paymentTermsCustomDays) — no equivalent for
  // Advance Payment or COD yet, so this only fires when CRM has a Net X
  // value set. Field values are set first, then 'change' is dispatched on
  // each select so the New Client PO form's own show/hide logic reveals
  // the right sub-fields, exactly as if picked by hand.
  if (so.paymentTermsDays) {
    setVal('paymentTermsType', 'Terms');
    document.getElementById('field-paymentTermsType')?.dispatchEvent(new Event('change'));
    setVal('paymentTermsDays', so.paymentTermsDays);
    document.getElementById('field-paymentTermsDays')?.dispatchEvent(new Event('change'));
    if (so.paymentTermsCustomDays != null) setVal('customPaymentDays', so.paymentTermsCustomDays);
  }

  if (Array.isArray(so.items) && so.items.length) {
    const descriptions = so.items.map(i => i.desc).filter(Boolean).join('; ');
    setVal('projectDescription', descriptions);
  }

  const noteParts = [`Pulled from CRM Sales Order ${so.orderNo || ''} (Control No. ${so.controlNo || ''}).`];
  if (so.notes) noteParts.push(so.notes);
  setVal('notes', noteParts.join(' '));

  // Recalculate commitment date if a lead time is already set
  const recalcEvent = new Event('change');
  document.getElementById('field-dateReceived')?.dispatchEvent(recalcEvent);
}

async function handleCreatePOSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('po-form-submit');
  const btnText = document.getElementById('po-form-submit-text');
  const errBox = document.getElementById('po-form-error');
  errBox.classList.add('hidden');

  const data = readPOFormValues();
  if (!data.clientName || !data.clientPONumber || !data.poType || !data.poAmount || !data.dateReceived) {
    errBox.textContent = 'Please fill in all required fields (marked with *).';
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    data.status = 'Open';
    await createClientPO(data);
    navigateTo('client-orders/open-pos');
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not save this PO. Please check your connection and try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Save Client PO';
  }
}

async function renderPOMonitoringPage() {

    const inDeliveryCount = all.filter(p => PO_DELIVERY_STATUSES.includes(p.status)).length;
    const readyCount = all.filter(p => p.status === 'Ready for Billing').length;
    const overdueCount = all.filter(isOverdue).length;
    const openValue = all.filter(p => !['Ready for Billing', 'Cancelled'].includes(p.status)).reduce((sum, p) => sum + (Number(p.poAmount) || 0), 0);

    const cards = [
      { label: 'Open POs', value: openCount, icon: 'inbox' },
      { label: 'In Delivery / Preparing', value: inDeliveryCount, icon: 'truck' },
      { label: 'Ready for Billing', value: readyCount, icon: 'check-circle' },
      { label: 'Overdue', value: overdueCount, icon: 'alert-triangle', tone: overdueCount > 0 ? 'text-red-600' : 'text-forest' },
      { label: 'Total Open Value', value: formatCurrency(openValue), icon: 'wallet', wide: true },
    ];

    document.getElementById('po-kpi-container').innerHTML = cards.map(c => `
      <div class="card p-5 ${c.wide ? 'sm:col-span-2' : ''}">
        <div class="flex items-start justify-between">
          <p class="text-xs font-medium text-muted uppercase tracking-wide">${c.label}</p>
          <div class="w-8 h-8 rounded-md bg-cream flex items-center justify-center ${c.tone || 'text-forest'}">${icon(c.icon, 'w-4 h-4')}</div>
        </div>
        <p class="text-2xl font-semibold text-charcoal mt-3">${c.value}</p>
      </div>`).join('');

    const recentSorted = [...all].sort((a, b) => {
      const at = a.updatedAt && a.updatedAt.toMillis ? a.updatedAt.toMillis() : 0;
      const bt = b.updatedAt && b.updatedAt.toMillis ? b.updatedAt.toMillis() : 0;
      return bt - at;
    }).slice(0, 10);

    document.getElementById('po-activity-container').innerHTML = poTableHtml(recentSorted, { emptyMessage: 'No activity yet.' });
    refreshIcons();
  } catch (e) {
    console.error(e);
    document.getElementById('po-kpi-container').innerHTML = poLoadErrorHtml();
    document.getElementById('po-activity-container').innerHTML = '';
  }
}

async function handleUpdatePOSubmit(e, id) {
  e.preventDefault();
  const btn = document.getElementById('po-form-submit');
  const btnText = document.getElementById('po-form-submit-text');
  const errBox = document.getElementById('po-form-error');
  errBox.classList.add('hidden');

  const data = readPOFormValues();

const ACCOUNTS_CHART = [

  "Owner's Capital", "Owner's Drawings", 'Other Income', 'Advances to Employees',
];
const EXPENSE_ACCOUNTS = ACCOUNTS_CHART.filter(a => a.endsWith('Expense'));
const CASH_OFFSET_ACCOUNTS = ["Owner's Capital", "Owner's Drawings", 'Other Income', 'Sales Revenue', ...EXPENSE_ACCOUNTS, 'Accounts Receivable', 'Accounts Payable'];
const TAX_TYPES = ['VAT', 'Withholding Tax', 'Percentage Tax'];

function spinnerHtml() {

/* ---- Generic Firestore helpers for Finance collections ---- */
async function createFinanceDoc(collectionName, data) {
  return addDoc(collection(db, collectionName), {
    ...data,
    createdAt: serverTimestamp(),
    createdBy: currentUser ? currentUser.email : null,
  });
}
async function updateFinanceDoc(collectionName, id, data) {
  return updateDoc(doc(db, collectionName, id), {
    ...data,
    updatedAt: serverTimestamp(),
    updatedBy: currentUser ? currentUser.email : null,
  });
}
async function fetchFinanceCollection(collectionName) {
  const snap = await getDocs(query(collection(db, collectionName), orderBy('createdAt', 'desc')));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fetchFinanceDoc(collectionName, id) {
  const snap = await getDoc(doc(db, collectionName, id));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}
async function postGLEntries(entries) {
  for (const entry of entries) {
    await addDoc(collection(db, 'generalLedger'), { ...entry, createdAt: serverTimestamp() });
  }
}

    if (bankAccounts.length && !bankAccountId) {

      const newStatus = newBalance <= 0.01 ? 'Paid' : (newAmountPaid > 0 ? 'Partially Paid' : 'Unpaid');

      btn.disabled = false; btnText.textContent = 'Record Payment';

  container.appendChild(row);

  row.querySelector('.je-debit').addEventListener('input', updateJournalTotals);

function updateJournalTotals() {
  let totalDebit = 0, totalCredit = 0;
  document.querySelectorAll('#je-lines [data-je-row]').forEach(row => {
    totalDebit += Number(row.querySelector('.je-debit').value) || 0;
    totalCredit += Number(row.querySelector('.je-credit').value) || 0;
  });
  document.getElementById('je-total-debit').textContent = formatCurrency(totalDebit);
  document.getElementById('je-total-credit').textContent = formatCurrency(totalCredit);
}
async function handleJournalEntrySubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('je-form-submit');
  const btnText = document.getElementById('je-form-submit-text');
  const errBox = document.getElementById('je-form-error');
  errBox.classList.add('hidden');

  const date = document.getElementById('field-je-date').value;
  const reference = document.getElementById('field-je-reference').value.trim();
  const lines = [];
  document.querySelectorAll('#je-lines [data-je-row]').forEach(row => {
    const account = row.querySelector('.je-account').value;
    const debit = Number(row.querySelector('.je-debit').value) || 0;
    const credit = Number(row.querySelector('.je-credit').value) || 0;
    if (account && (debit || credit)) lines.push({ account, debit, credit });
  });

  const totalDebit = lines.reduce((s, l) => s + l.debit, 0);
  const totalCredit = lines.reduce((s, l) => s + l.credit, 0);

  if (!date || !reference) {
    errBox.textContent = 'Date and Reference/Description are required.';
    errBox.classList.remove('hidden');
    return;
  }
  if (lines.length < 2) {
    errBox.textContent = 'Add at least two lines.';
    errBox.classList.remove('hidden');
    return;
  }
  if (Math.abs(totalDebit - totalCredit) > 0.01 || totalDebit === 0) {
    errBox.textContent = `Debits (${formatCurrency(totalDebit)}) and Credits (${formatCurrency(totalCredit)}) must balance and be greater than zero.`;
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true; btnText.innerHTML = spinnerHtml();
  try {
    const jeRef = await createFinanceDoc('journalEntries', { date, reference, lines });
    await postGLEntries(lines.map(l => ({ date, account: l.account, debit: l.debit, credit: l.credit, description: reference, sourceType: 'journal-entry', sourceId: jeRef.id })));
    navigateTo('finance/journal-entries');
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not post this journal entry. Please try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false; btnText.textContent = 'Post Journal Entry';
  }
}

  container.appendChild(row);

const BANK_ACCOUNT_TYPES = ['Checking', 'Savings', 'Cash', 'Other'];
const BANK_ACCOUNT_STATUSES = ['Active', 'Inactive'];
const CASH_TXN_TYPES = ['Deposit', 'Withdrawal', 'Transfer'];

function maskAccountNumber(num) {
  if (!num) return '';
  const clean = String(num).replace(/\s+/g, '');
  return clean.length > 4 ? '••••' + clean.slice(-4) : clean;
}
async function fetchActiveBankAccounts() {
  const all = await fetchFinanceCollection('bankAccounts');
  return all.filter(b => b.status !== 'Inactive');
}
function bankAccountSelectHtml(bankAccounts, selectedId, opts = {}) {
  return `
    <div>
      <label class="block text-sm font-medium text-charcoal mb-1.5">Bank Account${opts.required ? ' <span class="text-red-500">*</span>' : ''}</label>
      <select id="field-bankAccountId" ${opts.required ? 'required' : ''} class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">
        <option value="">Select...</option>
        ${bankAccounts.map(b => `<option value="${b.id}" ${b.id === selectedId ? 'selected' : ''}>${escapeAttr(b.nickname)}${b.bankName ? ' — ' + escapeAttr(b.bankName) : ''}</option>`).join('')}
      </select>
    </div>`;
}
async function computeBankAccountBalances(bankAccounts) {
  const glEntries = await fetchFinanceCollection('generalLedger');
  const balances = {};
  bankAccounts.forEach(b => { balances[b.id] = Number(b.openingBalance) || 0; });
  glEntries.forEach(g => {
    if (g.bankAccountId && Object.prototype.hasOwnProperty.call(balances, g.bankAccountId)) {
      balances[g.bankAccountId] += (Number(g.debit) || 0) - (Number(g.credit) || 0);
    }
  });
  return balances;
}
async function computeBankAccountBalanceAsOf(bankAccountId, openingBalance, asOfDate) {
  const glEntries = await fetchFinanceCollection('generalLedger');
  let balance = Number(openingBalance) || 0;
  glEntries.forEach(g => {
    if (g.bankAccountId === bankAccountId && (!asOfDate || g.date <= asOfDate)) {
      balance += (Number(g.debit) || 0) - (Number(g.credit) || 0);
    }
  });
  return balance;
}

        <div>

          <select id="field-fromBankAccountId" required class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">

          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-charcoal mb-1.5">To Account <span class="text-red-500">*</span></label>
          <select id="field-toBankAccountId" required class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">
            <option value="">Select...</option>
            ${accounts.map(a => `<option value="${a.id}">${escapeAttr(a.nickname)}</option>`).join('')}
          </select>
        </div>`;
    } else {
      fieldsContainer.innerHTML = `
        <div>
          <label class="block text-sm font-medium text-charcoal mb-1.5">Bank Account <span class="text-red-500">*</span></label>
          <select id="field-bankAccountId" required class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">
            <option value="">Select...</option>
            ${accounts.map(a => `<option value="${a.id}">${escapeAttr(a.nickname)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-charcoal mb-1.5">${type === 'Deposit' ? 'Source' : 'Category'} <span class="text-red-500">*</span></label>
          <select id="field-offsetAccount" required class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">
            <option value="">Select...</option>
            ${CASH_OFFSET_ACCOUNTS.map(a => `<option value="${a}">${a}</option>`).join('')}
          </select>
        </div>`;
    }
  }
  renderTypeFields();
  typeSel.addEventListener('change', renderTypeFields);

  document.getElementById('cash-txn-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('cash-txn-form-submit');
    const btnText = document.getElementById('cash-txn-form-submit-text');
    const errBox = document.getElementById('cash-txn-form-error');
    errBox.classList.add('hidden');

    const type = typeSel.value;
    const amount = Number(document.getElementById('field-txnAmount').value) || 0;
    const date = document.getElementById('field-txnDate').value;
    const description = document.getElementById('field-txnDescription').value.trim();

    if (!amount || amount <= 0 || !date) {
      errBox.textContent = 'Enter a valid amount and date.';
      errBox.classList.remove('hidden');
      return;
    }

    btn.disabled = true; btnText.innerHTML = spinnerHtml();
    try {
      if (type === 'Transfer') {
        const fromSel = document.getElementById('field-fromBankAccountId');
        const toSel = document.getElementById('field-toBankAccountId');
        const fromId = fromSel.value, toId = toSel.value;

          errBox.textContent = 'Select two different accounts to transfer between.';
          errBox.classList.remove('hidden');
          btn.disabled = false; btnText.textContent = 'Save Transaction';
          return;
        }
        const fromName = fromSel.options[fromSel.selectedIndex].text;
        const toName = toSel.options[toSel.selectedIndex].text;
        const txnRef = await createFinanceDoc('cashTransactions', { type, amount, date, description, fromBankAccountId: fromId, fromBankAccountName: fromName, toBankAccountId: toId, toBankAccountName: toName });
        await postGLEntries([
          { date, account: toName, debit: amount, credit: 0, description: description || `Transfer from ${fromName} to ${toName}`, sourceType: 'cash-transaction', sourceId: txnRef.id, bankAccountId: toId },
          { date, account: fromName, debit: 0, credit: amount, description: description || `Transfer from ${fromName} to ${toName}`, sourceType: 'cash-transaction', sourceId: txnRef.id, bankAccountId: fromId },
        ]);
      } else {
        const bankSel = document.getElementById('field-bankAccountId');
        const offsetSel = document.getElementById('field-offsetAccount');
        const bankAccountId = bankSel.value, offsetAccount = offsetSel.value;
        if (!bankAccountId || !offsetAccount) {
          errBox.textContent = 'Please fill in all required fields.';
          errBox.classList.remove('hidden');
          btn.disabled = false; btnText.textContent = 'Save Transaction';
          return;
        }
        const bankAccountName = bankSel.options[bankSel.selectedIndex].text;
        const txnRef = await createFinanceDoc('cashTransactions', { type, amount, date, description, bankAccountId, bankAccountName, offsetAccount });
        if (type === 'Deposit') {
          await postGLEntries([
            { date, account: bankAccountName, debit: amount, credit: 0, description: description || `Deposit — ${offsetAccount}`, sourceType: 'cash-transaction', sourceId: txnRef.id, bankAccountId },
            { date, account: offsetAccount, debit: 0, credit: amount, description: description || `Deposit — ${offsetAccount}`, sourceType: 'cash-transaction', sourceId: txnRef.id },
          ]);
        } else {
          await postGLEntries([
            { date, account: offsetAccount, debit: amount, credit: 0, description: description || `Withdrawal — ${offsetAccount}`, sourceType: 'cash-transaction', sourceId: txnRef.id },
            { date, account: bankAccountName, debit: 0, credit: amount, description: description || `Withdrawal — ${offsetAccount}`, sourceType: 'cash-transaction', sourceId: txnRef.id, bankAccountId },
          ]);
        }
      }
      navigateTo('cash-management/cash-position');
    } catch (err) {
      console.error(err);
      errBox.textContent = 'Could not save this transaction. Please try again.';
      errBox.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Save Transaction';
    }
  });
}

/* ---- Cash Forecast (fully automatic — reads AR/AP due dates) ---- */
async function renderCashForecastPage() {
  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">Cash Forecast</h1>
      <p class="text-sm text-muted mt-1">Projects future cash based on outstanding Accounts Receivable and Accounts Payable due dates.</p>
    </div>
    <div id="forecast-container" class="text-sm text-muted">Loading...</div>`);
  refreshIcons();
  try {
    const [bankAccounts, arEntries, apEntries] = await Promise.all([
      fetchFinanceCollection('bankAccounts'),
      fetchFinanceCollection('accountsReceivable'),
      fetchFinanceCollection('accountsPayable'),
    ]);
    const balances = await computeBankAccountBalances(bankAccounts);
    const currentCash = bankAccounts.reduce((sum, b) => sum + (balances[b.id] || 0), 0);

    const today = todayISO();
    function bucketFor(dueDate) {
      if (!dueDate) return 'No Due Date';
      if (dueDate < today) return 'Overdue';
      const days = Math.round((new Date(dueDate) - new Date(today)) / 86400000);
      if (days <= 7) return 'Next 7 Days';
      if (days <= 30) return '8–30 Days';
      if (days <= 60) return '31–60 Days';
      return '60+ Days';
    }
    const BUCKET_ORDER = ['Overdue', 'Next 7 Days', '8–30 Days', '31–60 Days', '60+ Days', 'No Due Date'];
    const buckets = {};
    BUCKET_ORDER.forEach(b => { buckets[b] = { inflow: 0, outflow: 0 }; });

    arEntries.filter(e => (Number(e.balance) || 0) > 0.01).forEach(e => {
      buckets[bucketFor(e.dueDate)].inflow += Number(e.balance) || 0;
    });
    apEntries.filter(e => (Number(e.balance) || 0) > 0.01).forEach(e => {
      buckets[bucketFor(e.dueDate)].outflow += Number(e.balance) || 0;
    });

    let running = currentCash;
    const rows = BUCKET_ORDER.map(b => {
      const net = buckets[b].inflow - buckets[b].outflow;
      running += net;
      return { bucket: b, inflow: buckets[b].inflow, outflow: buckets[b].outflow, net, running };
    });

    document.getElementById('forecast-container').innerHTML = `
      <div class="card p-5 mb-6 max-w-sm">
        <p class="text-xs font-medium text-muted uppercase tracking-wide">Current Cash (all accounts)</p>
        <p class="text-2xl font-semibold text-forest mt-3">${formatCurrency(currentCash)}</p>
      </div>
      <div class="card overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-borderc text-left text-xs text-muted uppercase tracking-wide">
            <th class="px-4 py-3">Period</th><th class="px-4 py-3 text-right">Expected In (AR)</th><th class="px-4 py-3 text-right">Expected Out (AP)</th><th class="px-4 py-3 text-right">Net</th><th class="px-4 py-3 text-right">Projected Balance</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr class="border-b border-borderc last:border-0">
                <td class="px-4 py-3 font-medium text-charcoal">${r.bucket}</td>
                <td class="px-4 py-3 text-right text-teal-700">${r.inflow ? formatCurrency(r.inflow) : '—'}</td>
                <td class="px-4 py-3 text-right text-red-600">${r.outflow ? formatCurrency(r.outflow) : '—'}</td>
                <td class="px-4 py-3 text-right ${r.net < 0 ? 'text-red-600' : 'text-charcoal'}">${formatCurrency(r.net)}</td>
                <td class="px-4 py-3 text-right font-medium">${formatCurrency(r.running)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-xs text-muted mt-3">Based on outstanding Accounts Receivable and Accounts Payable balances and their due dates as of today.</p>`;
  } catch (e) {
    console.error(e);
    document.getElementById('forecast-container').innerHTML = poLoadErrorHtml();
  }
}

/* ---- Payment execution (called on immediate-approve or batch-process) ---- */
async function executeRegularPaymentDV(dv) {
  const { sourceCollection, sourceId, amount, modeOfPayment, bankAccountId, bankAccountName, datePaid, number } = dv;
  if (sourceCollection === 'accountsPayable') {
    const ap = await fetchFinanceDoc('accountsPayable', sourceId);
    const newAmountPaid = Number(((ap.amountPaid || 0) + amount).toFixed(2));
    const newBalance = Number((ap.amount - newAmountPaid).toFixed(2));
    const newStatus = newBalance <= 0.01 ? 'Paid' : (newAmountPaid > 0 ? 'Partially Paid' : 'Unpaid');
    const payments = Array.isArray(ap.payments) ? [...ap.payments] : [];
    payments.push({ date: datePaid, amount, method: modeOfPayment, notes: `DV ${number}`, bankAccountId, bankAccountName, recordedBy: currentUser ? currentUser.email : null });
    await updateFinanceDoc('accountsPayable', sourceId, { amountPaid: newAmountPaid, balance: newBalance, status: newStatus, payments });
    await postGLEntries([
      { date: datePaid, account: 'Accounts Payable', debit: amount, credit: 0, description: `Payment made — ${ap.payee} (DV ${number})`, sourceType: 'ap-payment', sourceId },
      { date: datePaid, account: bankAccountName, debit: 0, credit: amount, description: `Payment made — ${ap.payee} (DV ${number})`, sourceType: 'ap-payment', sourceId, bankAccountId },
    ]);
  } else if (sourceCollection === 'expenses') {
    const exp = await fetchFinanceDoc('expenses', sourceId);
    await updateFinanceDoc('expenses', sourceId, { status: 'Paid', datePaid, bankAccountId, bankAccountName });
    await postGLEntries([
      { date: datePaid, account: exp.category, debit: exp.amount, credit: 0, description: `Expense paid — ${exp.category} (DV ${number})`, sourceType: 'expense', sourceId },
      { date: datePaid, account: bankAccountName, debit: 0, credit: exp.amount, description: `Expense paid — ${exp.category} (DV ${number})`, sourceType: 'expense', sourceId, bankAccountId },
    ]);
  } else if (sourceCollection === 'taxRecords') {
    const tax = await fetchFinanceDoc('taxRecords', sourceId);
    await updateFinanceDoc('taxRecords', sourceId, { filingStatus: 'Paid', datePaid, bankAccountId, bankAccountName });
    await postGLEntries([
      { date: datePaid, account: 'Taxes & Licenses Expense', debit: tax.taxAmount, credit: 0, description: `Tax paid (DV ${number})`, sourceType: 'tax', sourceId },
      { date: datePaid, account: bankAccountName, debit: 0, credit: tax.taxAmount, description: `Tax paid (DV ${number})`, sourceType: 'tax', sourceId, bankAccountId },
    ]);
  }
}
async function executeReplenishmentDV(dv) {
  const { accountTitleBreakdown, bankAccountName, bankAccountId, datePaid, number, pcvIds, id, batchId } = dv;
  const glLines = (accountTitleBreakdown || []).map(item => ({
    date: datePaid, account: item.account, debit: item.amount, credit: 0,
    description: `Petty cash replenishment (DV ${number})`, sourceType: 'petty-cash-replenishment', sourceId: id,
  }));
  glLines.push({ date: datePaid, account: bankAccountName, debit: 0, credit: dv.amount, description: `Petty cash replenishment (DV ${number})`, sourceType: 'petty-cash-replenishment', sourceId: id, bankAccountId });
  await postGLEntries(glLines);
  for (const pcvId of (pcvIds || [])) {
    await updateFinanceDoc('pettyCashVouchers', pcvId, { replenished: true, replenishmentBatchId: batchId || null });
  }
}
async function executeCashAdvanceReleaseDV(dv) {
  const { amount, bankAccountName, bankAccountId, datePaid, number, cashAdvanceId } = dv;
  await postGLEntries([
    { date: datePaid, account: 'Advances to Employees', debit: amount, credit: 0, description: `Cash advance released (DV ${number})`, sourceType: 'cash-advance-release', sourceId: cashAdvanceId },
    { date: datePaid, account: bankAccountName, debit: 0, credit: amount, description: `Cash advance released (DV ${number})`, sourceType: 'cash-advance-release', sourceId: cashAdvanceId, bankAccountId },
  ]);
  await updateFinanceDoc('cashAdvances', cashAdvanceId, { status: 'Outstanding', dateReleased: datePaid, bankAccountId, bankAccountName });
}
async function executeDisbursementVoucher(dv) {
  if (dv.type === 'Regular Payment') return executeRegularPaymentDV(dv);
  if (dv.type === 'Petty Cash Replenishment') return executeReplenishmentDV(dv);
  if (dv.type === 'Cash Advance Release') return executeCashAdvanceReleaseDV(dv);
}
async function dvRequiresBatching(dv) {
  if (dv.type !== 'Regular Payment') return true;
  if (!dv.bankAccountId) return false;
  const bankAccount = await fetchFinanceDoc('bankAccounts', dv.bankAccountId);
  return !!(bankAccount && bankAccount.accountType === 'Cash');
}

      <p class="text-sm text-muted mt-1">${v.type}</p>

  if (v.status === 'Pending' && canApproveDisbursements()) {

  }

      errBox.textContent = 'Could not cancel this voucher. Please try again.';
      errBox.classList.remove('hidden');
      setBusy(false);
    }
  });
}

    }
    document.getElementById('batch-list-container').innerHTML = `

        <div id="batch-form-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>

                  <td class="px-4 py-3 font-medium text-charcoal">${v.number}</td>
                  <td class="px-4 py-3">${v.type}</td>
                  <td class="px-4 py-3">${v.payee || '—'}</td>
                  <td class="px-4 py-3">${v.bankAccountName || '—'}</td>
                  <td class="px-4 py-3 text-right">${formatCurrency(v.amount)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="card p-5 max-w-md">
          <p class="text-sm text-charcoal">Selected total: <span id="batch-total" class="font-semibold text-forest">₱ 0.00</span> (<span id="batch-count">0</span> voucher(s))</p>
          <div class="mt-3">
            ${dateField('batchDate', 'Encashment Date', { required: true, value: todayISO() })}
          </div>
          <button type="submit" id="batch-submit" class="btn-primary text-sm mt-4"><span id="batch-submit-text">Process Batch</span></button>
        </div>
      </form>`;
    refreshIcons();

    const checkboxes = () => Array.from(document.querySelectorAll('.batch-item'));
    const updateTotals = () => {
      const checked = checkboxes().filter(c => c.checked);
      const total = checked.reduce((s, c) => s + Number(c.getAttribute('data-amount') || 0), 0);
      document.getElementById('batch-total').textContent = formatCurrency(total);
      document.getElementById('batch-count').textContent = checked.length;
    };
    document.getElementById('batch-select-all').addEventListener('change', (e) => {
      checkboxes().forEach(c => { c.checked = e.target.checked; });
      updateTotals();
    });
    checkboxes().forEach(c => c.addEventListener('change', updateTotals));

    document.getElementById('batch-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('batch-submit');
      const btnText = document.getElementById('batch-submit-text');
      const errBox = document.getElementById('batch-form-error');
      errBox.classList.add('hidden');
      const selectedIds = checkboxes().filter(c => c.checked).map(c => c.value);
      const batchDate = document.getElementById('field-batchDate').value;

      if (!selectedIds.length) {
        errBox.textContent = 'Select at least one voucher to encash.';
        errBox.classList.remove('hidden');
        return;
      }
      if (!batchDate) {
        errBox.textContent = 'Enter the encashment date.';
        errBox.classList.remove('hidden');
        return;
      }

      btn.disabled = true; btnText.innerHTML = spinnerHtml();
      try {
        const selectedVouchers = pending.filter(v => selectedIds.includes(v.id));
        const totalAmount = selectedVouchers.reduce((s, v) => s + (Number(v.amount) || 0), 0);
        const batchNumber = await generateSeriesNumber('encashmentBatches', 'ENC', 'number');
        const batchRef = await createFinanceDoc('encashmentBatches', {
          number: batchNumber, batchDate,
          voucherRefs: selectedVouchers.map(v => ({ id: v.id, type: v.type, number: v.number, amount: v.amount, accountTitleBreakdown: v.accountTitleBreakdown || [{ account: v.accountTitle, amount: v.amount }] })),
          totalAmount, processedBy: currentUser.email, status: 'Processed',
        });
        for (const v of selectedVouchers) {
          await executeDisbursementVoucher({ ...v, datePaid: batchDate, batchId: batchRef.id });
          await updateFinanceDoc('disbursementVouchers', v.id, { status: 'Paid', datePaid: batchDate, batchId: batchRef.id, batchNumber });
        }
        refreshApprovalsBadge();
        navigateTo('disbursement/encashment-summary');
      } catch (err) {
        console.error(err);
        errBox.textContent = 'Could not process this batch. Please try again.';
        errBox.classList.remove('hidden');
        btn.disabled = false; btnText.textContent = 'Process Batch';
      }
    });
  } catch (e) {
    console.error(e);
    document.getElementById('batch-list-container').innerHTML = poLoadErrorHtml();
  }
}

/* ---- Petty Cash ---- */
async function computePettyCashOnHand(fund) {
  const pcvs = await fetchFinanceCollection('pettyCashVouchers');
  const unreplenished = pcvs.filter(p => p.fundId === fund.id && p.status === 'Paid' && !p.replenished);
  const spent = unreplenished.reduce((s, p) => s + (Number(p.amount) || 0), 0);
  return { cashOnHand: Number((fund.openingBalance - spent).toFixed(2)), unreplenished };
}

function caAgingBadge(ca) {
  if (ca.status !== 'Outstanding' || !ca.dateReleased) return '';
  const days = Math.round((new Date(todayISO()) - new Date(ca.dateReleased)) / 86400000);
  if (days > CA_AGING_DAYS) {
    return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border bg-red-50 text-red-600 border-red-200">${days}d overdue</span>`;
  }
  return '';
}

  try { ca = await fetchFinanceDoc('cashAdvances', id); } catch (e) { console.error(e); contentWrap(poLoadErrorHtml()); return; }
  if (!ca) { contentWrap(`<div class="card flex flex-col items-center justify-center text-center py-16 px-6"><p class="text-sm text-charcoal font-medium">Cash advance not found.</p><a href="#/disbursement/cash-advances" class="mt-4 text-sm text-forest hover:underline">Back to Cash Advances</a></div>`); return; }
  if (ca.status !== 'Outstanding') { contentWrap(`<div class="card flex flex-col items-center justify-center text-center py-16 px-6"><p class="text-sm text-charcoal font-medium">This advance is not outstanding.</p><a href="#/disbursement/cash-advances" class="mt-4 text-sm text-forest hover:underline">Back to Cash Advances</a></div>`); return; }

  let bankAccounts = [];
  try { bankAccounts = await fetchActiveBankAccounts(); } catch (e) { console.error(e); }

  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">Liquidate Cash Advance</h1>
      <p class="text-sm text-muted mt-1">${ca.number} — ${escapeAttr(ca.employeeName)} · Advanced ${formatCurrency(ca.amount)}</p>
    </div>
    <form id="liq-form" class="card p-6 space-y-4 max-w-3xl">
      <div id="liq-form-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>
      ${dateField('liqDate', 'Liquidation Date', { required: true, value: todayISO() })}
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-medium text-charcoal">Itemized Expenses</label>
          <button type="button" id="liq-add-line" class="text-xs font-medium text-forest hover:underline">+ Add Line</button>
        </div>
        <div id="liq-lines" class="space-y-2"></div>
        <div class="flex items-center justify-between mt-3 text-sm border-t border-borderc pt-3">
          <span class="text-muted">Advanced: <span class="font-medium text-charcoal">${formatCurrency(ca.amount)}</span></span>
          <span class="text-muted">Total Itemized: <span id="liq-total" class="font-medium text-charcoal">₱ 0.00</span></span>
          <span class="text-muted">Difference: <span id="liq-diff" class="font-medium text-charcoal">₱ 0.00</span></span>
        </div>
      </div>
      <div id="liq-return-wrap">
        ${bankAccountSelectHtml(bankAccounts, null, {})}
        <p class="text-xs text-muted mt-1.5">Account that receives any cash the employee returns (only used if itemized total is less than the advance).</p>
      </div>
      <div class="flex items-center gap-3 pt-2 border-t border-borderc">
        <button id="liq-submit" type="submit" class="btn-primary"><span id="liq-submit-text">Save Liquidation</span></button>
        <a href="#/disbursement/cash-advances" class="text-sm text-muted hover:text-charcoal">Cancel</a>
      </div>
    </form>`);
  refreshIcons();

  function addLiqLine() {
    const container = document.getElementById('liq-lines');
    const row = document.createElement('div');
    row.className = 'grid grid-cols-12 gap-2 items-center';
    row.setAttribute('data-liq-row', '1');
    row.innerHTML = `
      <div class="col-span-4">
        <select class="liq-category w-full rounded-md border border-borderc bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">
          <option value="">Select account...</option>
          ${EXPENSE_ACCOUNTS.map(a => `<option value="${a}">${a}</option>`).join('')}
        </select>
      </div>
      <div class="col-span-5">
        <input type="text" placeholder="Description" class="liq-desc w-full rounded-md border border-borderc bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest" />
      </div>
      <div class="col-span-2">
        <input type="number" step="0.01" min="0" placeholder="Amount" class="liq-amount w-full rounded-md border border-borderc bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest" />
      </div>
      <div class="col-span-1 text-right">
        <button type="button" class="liq-remove text-muted hover:text-red-600" title="Remove">${icon('x', 'w-4 h-4')}</button>
      </div>`;
    container.appendChild(row);
    refreshIcons();
    row.querySelector('.liq-amount').addEventListener('input', updateLiqTotals);
    row.querySelector('.liq-remove').addEventListener('click', () => { row.remove(); updateLiqTotals(); });
  }
  function updateLiqTotals() {
    let total = 0;
    document.querySelectorAll('#liq-lines [data-liq-row]').forEach(row => { total += Number(row.querySelector('.liq-amount').value) || 0; });
    document.getElementById('liq-total').textContent = formatCurrency(total);
    const diff = Number((ca.amount - total).toFixed(2));
    const diffEl = document.getElementById('liq-diff');
    diffEl.textContent = (diff >= 0 ? '' : '-') + formatCurrency(Math.abs(diff));
    diffEl.className = diff > 0 ? 'font-medium text-forest' : (diff < 0 ? 'font-medium text-orange-600' : 'font-medium text-charcoal');
  }
  addLiqLine(); addLiqLine();
  document.getElementById('liq-add-line').addEventListener('click', addLiqLine);

  document.getElementById('liq-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('liq-submit');
    const btnText = document.getElementById('liq-submit-text');
    const errBox = document.getElementById('liq-form-error');
    errBox.classList.add('hidden');

    const liqDate = document.getElementById('field-liqDate').value;
    const items = [];
    document.querySelectorAll('#liq-lines [data-liq-row]').forEach(row => {
      const category = row.querySelector('.liq-category').value;
      const description = row.querySelector('.liq-desc').value.trim();
      const amount = Number(row.querySelector('.liq-amount').value) || 0;
      if (category && amount) items.push({ category, description, amount });
    });
    const totalLiquidated = Number(items.reduce((s, i) => s + i.amount, 0).toFixed(2));
    const excess = Math.max(0, Number((ca.amount - totalLiquidated).toFixed(2)));
    const shortfall = Math.max(0, Number((totalLiquidated - ca.amount).toFixed(2)));

    if (!liqDate || !items.length) {
      errBox.textContent = 'Enter the liquidation date and at least one itemized expense.';
      errBox.classList.remove('hidden');
      return;
    }
    const bankSel = document.getElementById('field-bankAccountId');
    const returnAccountId = bankSel ? bankSel.value : '';
    const returnAccountName = bankSel && returnAccountId ? bankSel.options[bankSel.selectedIndex].text : '';
    if (excess > 0 && !returnAccountId) {
      errBox.textContent = 'Select which account receives the returned cash.';
      errBox.classList.remove('hidden');
      return;
    }

    btn.disabled = true; btnText.innerHTML = spinnerHtml();
    try {
      const glLines = items.map(i => ({
        date: liqDate, account: i.category, debit: i.amount, credit: 0,
        description: `Cash advance liquidation — ${ca.number} (${i.description || i.category})`, sourceType: 'cash-advance-liquidation', sourceId: id,
      }));
      glLines.push({ date: liqDate, account: 'Advances to Employees', debit: 0, credit: ca.amount, description: `Cash advance liquidation — ${ca.number}`, sourceType: 'cash-advance-liquidation', sourceId: id });

      let shortfallAPId = null;
      if (excess > 0) {
        glLines.push({ date: liqDate, account: returnAccountName, debit: excess, credit: 0, description: `Cash advance excess returned — ${ca.number}`, sourceType: 'cash-advance-liquidation', sourceId: id, bankAccountId: returnAccountId });
      } else if (shortfall > 0) {
        const apRef = await createFinanceDoc('accountsPayable', {
          source: 'cash-advance-shortfall', payee: ca.employeeName, category: 'Advances to Employees',
          amount: shortfall, amountPaid: 0, balance: shortfall, status: 'Unpaid', payments: [],
          dateReceived: liqDate, dueDate: '', description: `Cash advance shortfall reimbursement — ${ca.number}`,
        });
        shortfallAPId = apRef.id;
        glLines.push({ date: liqDate, account: 'Accounts Payable', debit: 0, credit: shortfall, description: `Cash advance shortfall — ${ca.number}`, sourceType: 'ap-payment', sourceId: apRef.id });
      }
      await postGLEntries(glLines);

      await updateFinanceDoc('cashAdvances', id, {
        status: 'Liquidated',
        liquidation: { dateLiquidated: liqDate, items, totalLiquidated, excess, shortfall, returnedToAccountId: returnAccountId || null, returnedToAccountName: returnAccountName || null, shortfallAPId },
      });
      navigateTo('disbursement/cash-advances');
    } catch (err) {
      console.error(err);
      errBox.textContent = 'Could not save this liquidation. Please try again.';
      errBox.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Save Liquidation';
    }
  });
}

      <h2 class="text-base font-medium text-charcoal">Approvals are limited to Managers and Admins</h2>

            <th class="px-4 py-3">DV #</th><th class="px-4 py-3">Type</th><th class="px-4 py-3">Payee</th><th class="px-4 py-3">Account Title</th><th class="px-4 py-3">Amount</th><th class="px-4 py-3">Requested By</th><th class="px-4 py-3">Date</th><th class="px-4 py-3 text-right">Action</th>
          </tr></thead>

            ${pending.map(v => `
              <tr class="border-b border-borderc last:border-0 hover:bg-cream/50">

        <div class="w-12 h-12 rounded-full bg-cream flex items-center justify-center text-forest mb-3">${icon('check-circle', 'w-5 h-5')}</div>

}

/* ---- Teams (Settings > Teams) — staff accounts and role management ---- */
function teamsTableHtml(users) {
  if (!users.length) {
    return `<div class="card flex flex-col items-center justify-center text-center py-16 px-6">
      <div class="w-12 h-12 rounded-full bg-cream flex items-center justify-center text-forest mb-3">${icon('inbox', 'w-5 h-5')}</div>
      <p class="text-sm text-muted">No accounts yet.</p>
    </div>`;
  }
  return `
    <div class="card overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="border-b border-borderc text-left text-xs text-muted uppercase tracking-wide">
          <th class="px-4 py-3">Name</th><th class="px-4 py-3">Email</th><th class="px-4 py-3">Department</th><th class="px-4 py-3">Role</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Created</th>
        </tr></thead>
        <tbody>
          ${users.map(u => {
            const created = u.createdAt && u.createdAt.toDate ? formatDate(u.createdAt.toDate().toISOString().slice(0, 10)) : '—';
            const roleKnown = TEAM_ROLES.includes(u.role);
            return `
              <tr class="border-b border-borderc last:border-0 hover:bg-cream/50">
                <td class="px-4 py-3 font-medium text-charcoal">${u.name || '—'}</td>
                <td class="px-4 py-3">${u.email || '—'}</td>
                <td class="px-4 py-3">${u.department || '—'}</td>
                <td class="px-4 py-3">
                  <select data-team-role="${u.id}" class="text-xs border border-borderc rounded-md px-2 py-1 bg-white focus:outline-none focus:ring-2 focus:ring-forest">
                    ${!roleKnown ? `<option value="${u.role}" selected>${roleLabel(u.role)}</option>` : ''}
                    ${TEAM_ROLES.map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${roleLabel(r)}</option>`).join('')}
                  </select>
                </td>
                <td class="px-4 py-3">
                  <select data-team-status="${u.id}" class="text-xs border border-borderc rounded-md px-2 py-1 bg-white focus:outline-none focus:ring-2 focus:ring-forest">
                    <option value="true" ${u.isActive !== false ? 'selected' : ''}>Active</option>
                    <option value="false" ${u.isActive === false ? 'selected' : ''}>Inactive</option>
                  </select>
                </td>
                <td class="px-4 py-3">${created}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}
function wireTeamsSelects() {
  document.querySelectorAll('[data-team-role]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const uid = sel.getAttribute('data-team-role');
      sel.disabled = true;
      try {
        await updateFinanceDoc('users', uid, { role: sel.value });
        if (currentUser && uid === currentUser.uid) currentProfile = { ...currentProfile, role: sel.value };
        renderTeamsPage();
      } catch (e) {
        console.error(e);
        alert('Could not update this account\'s role. Please try again.');
        sel.disabled = false;
      }
    });
  });
  document.querySelectorAll('[data-team-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const uid = sel.getAttribute('data-team-status');
      sel.disabled = true;
      try {
        await updateFinanceDoc('users', uid, { isActive: sel.value === 'true' });
        renderTeamsPage();
      } catch (e) {
        console.error(e);
        alert('Could not update this account\'s status. Please try again.');
        sel.disabled = false;
      }
    });
  });
}
async function renderTeamsPage() {
  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">Teams</h1>
      <p class="text-sm text-muted mt-1">Staff accounts and roles. New sign-ups default to Operations — the first account ever created is always System Admin automatically. Change roles below as needed.</p>
    </div>
    <div id="teams-list-container" class="text-sm text-muted">Loading...</div>`);
  refreshIcons();
  try {
    const users = await fetchFinanceCollection('users');
    document.getElementById('teams-list-container').innerHTML = teamsTableHtml(users);
    refreshIcons();
    wireTeamsSelects();
  } catch (e) {
    console.error(e);
    document.getElementById('teams-list-container').innerHTML = poLoadErrorHtml();
  }
}

/* ==========================================================================
   AUTH BOOTSTRAP
   ========================================================================== */
async function isFirstAccount() {
  try {
    const existing = await getDocs(query(collection(db, 'users'), limit(1)));
    return existing.empty;
  } catch (e) {
    console.warn('Could not check for existing users, defaulting role to operations.', e);
    return false;
  }
}

async function ensureUserProfile(user) {
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    return snap.data();
  }

  // Reached only if a profile doc wasn't already created at sign-up time
  // (e.g. an account created directly in the Firebase console). Same
  // first-account-becomes-admin rule applies here too.
  const isFirstUser = await isFirstAccount();
  const profile = {
    name: user.email.split('@')[0],
    email: user.email,
    role: isFirstUser ? 'system_admin' : 'operations',
    department: isFirstUser ? 'Administration' : 'Operations',
    isActive: true,
    createdAt: serverTimestamp(),
  };
  await setDoc(ref, profile);
  return profile;
}

function initRouter() {
  window.addEventListener('hashchange', renderRoute);
  if (!window.location.hash) window.location.hash = '#/dashboard';
  renderRoute();
}

async function bootstrap() {
  if (!firebaseReady) {
    renderLogin();
    return;
  }
  renderLoading();
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      try {
        currentProfile = await ensureUserProfile(user);
      } catch (e) {
        console.error('Could not load/create user profile:', e);
        currentProfile = { name: user.email, email: user.email, role: 'operations', department: 'Operations', isActive: true };
      }
      renderShell();
      initRouter();
    } else {
      currentUser = null;
      currentProfile = null;
      renderLogin();
    }
  });
}

bootstrap();
</script>
