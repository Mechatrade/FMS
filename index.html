// role -> which top-level module paths are visible. Empty for now (every
// signed-in user sees every module) until real per-role access is defined.
const ROLE_PERMISSIONS = {
  super_admin:     {},
  finance_manager: {},
  finance_staff:   {},
  admin:           {},

};

let currentUser = null;
let currentProfile = null;

/* ==========================================================================
   HELPERS
   ========================================================================== */
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function icon(name, cls = "w-5 h-5") {
  return `<i data-lucide="${name}" class="${cls}"></i>`;
}
function refreshIcons() { if (window.lucide) lucide.createIcons(); }
function findNavByPath(path) {
  for (const item of NAV) {
    if (item.path === path) return { item, child: null };
    if (item.children) {
      const child = item.children.find(c => c.path === path);
      if (child) return { item, child };
    }
  }
  return null;
}
function canAccess(topPath) {
  if (!currentProfile) return true;
  const perms = ROLE_PERMISSIONS[currentProfile.role] || {};
  return perms[topPath] !== false;
}

/* ==========================================================================

}

function renderLogin(mode = "signin") {
  const isSignup = mode === "signup";

  root.innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-cream px-4">
      <div class="w-full max-w-md">
        <div class="bg-white border border-borderc rounded-xl shadow-card p-8 fade-in">

            </div>
            <h1 class="text-lg font-semibold text-charcoal text-center">${APP_NAME}</h1>
            <p class="text-sm text-muted mt-1">${isSignup ? 'Create your account' : 'Sign in to continue'}</p>
          </div>

          ${!firebaseReady ? `
            <div class="mb-4 text-sm bg-amber-50 border border-amber-200 text-amber-800 rounded-md px-3 py-2">
              Firebase is not configured yet. Add your project keys to the <code class="font-mono">firebaseConfig</code> object near the top of this file.
            </div>` : ''}

          <form id="login-form" class="space-y-4">
            <div id="login-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>

            ${isSignup ? `
            <div>
              <label class="block text-sm font-medium text-charcoal mb-1.5">Full Name</label>
              <input id="login-name" type="text" required autocomplete="name"
                class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest"
                placeholder="Juan Dela Cruz" />
            </div>` : ''}

            <div>
              <label class="block text-sm font-medium text-charcoal mb-1.5">Email</label>
              <input id="login-email" type="email" required autocomplete="username"
                class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest"
                placeholder="you@mechatrade.com" />
            </div>

            <div>
              <label class="block text-sm font-medium text-charcoal mb-1.5">Password</label>
              <div class="relative">
                <input id="login-password" type="password" required autocomplete="${isSignup ? 'new-password' : 'current-password'}"
                  class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest"
                  placeholder="••••••••" />
                <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-charcoal">
                  ${icon('eye', 'w-4 h-4')}
                </button>
              </div>
              ${isSignup ? `<p class="text-xs text-muted mt-1.5">At least 6 characters.</p>` : ''}
            </div>

            <div>

  const pwInput = document.getElementById('login-password');
  document.getElementById('toggle-password').addEventListener('click', () => {

  document.getElementById('mode-toggle').addEventListener('click', () => {

  if (forgotLink) {
    forgotLink.addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim();
      if (!email) { showLoginError('Enter your email above first, then click "Forgot password?" again.'); return; }
      try {

        showLoginError('Password reset email sent. Check your inbox.', true);
      } catch (e) {
        showLoginError(friendlyAuthError(e));
      }
    });
  }

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (isSignup) { handleSignUp(); } else { handleSignIn(); }

async function handleSignIn() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const remember = document.getElementById('login-remember').checked;
  const btn = document.getElementById('login-submit');
  const btnText = document.getElementById('login-submit-text');

  if (!firebaseReady) { showLoginError('Firebase is not configured. See the firebaseConfig object near the top of this file.'); return; }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged will take over rendering
  } catch (err) {
    showLoginError(friendlyAuthError(err));
    btn.disabled = false;
    btnText.textContent = 'Sign In';
  }
}

async function handleSignUp() {
  const name = document.getElementById('login-name').value.trim();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const confirmPassword = document.getElementById('login-password-confirm').value;
  const btn = document.getElementById('login-submit');
  const btnText = document.getElementById('login-submit-text');

  if (!firebaseReady) { showLoginError('Firebase is not configured. See the firebaseConfig object near the top of this file.'); return; }
  if (password !== confirmPassword) { showLoginError('Passwords do not match.'); return; }
  if (password.length < 6) { showLoginError('Password must be at least 6 characters.'); return; }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    const isFirstUser = await isFirstAccount();
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: name || email.split('@')[0],
      email,
      role: isFirstUser ? 'super_admin' : 'finance_staff',
      department: isFirstUser ? 'Administration' : 'Finance',
      isActive: true,
      createdAt: serverTimestamp(),
    });
    // onAuthStateChanged will take over rendering; ensureUserProfile will
    // find this doc already created and just use it.
  } catch (err) {
    showLoginError(friendlyAuthError(err));
    btn.disabled = false;
    btnText.textContent = 'Create Account';
  }
}

function showLoginError(msg, isSuccess = false) {
  const box = document.getElementById('login-error');
  if (!box) return;
  box.textContent = msg;
  box.classList.remove('hidden');
  if (isSuccess) {
    box.classList.remove('bg-red-50','border-red-200','text-red-700');
    box.classList.add('bg-green-50','border-green-200','text-green-700');
  }
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : '';
  const map = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-disabled': 'This account has been disabled.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Please wait and try again.',
    'auth/email-already-in-use': 'An account with that email already exists. Try signing in instead.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Firebase rejected the API key in firebaseConfig. Double-check you copied it exactly from Project Settings > General > Your apps, with no missing characters or quotes.',
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

/* ==========================================================================

function sidebarHtml() {
  const items = NAV.map(item => {
    const visible = canAccess(item.path);
    if (!visible) return '';
    const hasChildren = !!item.children;
    return `
      <div class="nav-group" data-nav-key="${item.path}">
        <button class="nav-link w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-md text-sm font-medium text-cream/90 hover:bg-white/10 transition-colors" data-nav-toggle="${item.path}">
          <span class="flex items-center gap-2.5">
            ${icon(item.icon, 'w-[18px] h-[18px]')}
            ${item.name}
          </span>
          ${hasChildren ? icon('chevron-down', 'w-4 h-4 nav-chevron transition-transform') : ''}
        </button>
        ${hasChildren ? `
          <div class="nav-children pl-9 space-y-0.5 mt-0.5 overflow-hidden" data-nav-children="${item.path}">
            ${item.children.map(c => `
              <a href="#/${c.path}" data-route="${c.path}"
                 class="nav-link block px-3 py-2 rounded-md text-[13px] text-cream/70 hover:text-cream hover:bg-white/10 transition-colors">
                ${c.name}
              </a>`).join('')}
          </div>` : ''}
      </div>`;
  }).join('');

  return `
    <aside id="sidebar" class="fixed lg:static z-40 inset-y-0 left-0 w-64 bg-forest flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">

function navigateTo(path) {
  window.location.hash = `#/${path}`;
}

function currentPathFromHash() {
  const h = window.location.hash || '#/dashboard';
  return h.replace(/^#\//, '') || 'dashboard';
}

function buildBreadcrumb(topItem, childItem) {
  const parts = [];
  if (topItem) parts.push(topItem.name);
  if (childItem && childItem.name !== (topItem && topItem.name)) parts.push(childItem.name);
  const bc = document.getElementById('breadcrumb');
  if (bc) bc.innerHTML = parts.map((p, i) =>
    `<span class="${i === parts.length - 1 ? 'text-charcoal font-medium' : ''}">${p}</span>`
  ).join(' <span class="text-borderc">/</span> ');
}

function renderRoute() {
  if (!currentUser) return; // guarded elsewhere
  const path = currentPathFromHash();

  // Standby / future module check (not in NAV, reached only via config)
  const standbyKey = Object.keys(STANDBY_MODULES).find(k => path === `future/${k}`);
  if (standbyKey) {
    renderModuleNotAvailable(STANDBY_MODULES[standbyKey].name);
    return;
  }

  // Dynamic route: editing a single Client PO (not in NAV, has an id in the path)
  if (path.startsWith('client-orders/edit/')) {
    if (!canAccess('client-orders')) { renderNoAccess('Client Orders'); buildBreadcrumb(null, null); return; }
    const poId = path.substring('client-orders/edit/'.length);
    setActiveNav('client-orders/open-pos', NAV.find(n => n.path === 'client-orders')); // best-effort highlight
    buildBreadcrumb(NAV.find(n => n.path === 'client-orders'), { name: 'Edit Client PO' });
    renderClientPOEditPage(poId);
    return;
  }

  // Dynamic Finance routes (not in NAV — reached via buttons/links on the Finance pages)
  const financeDynamicRoutes = {
    'finance/ar/new': { fn: renderNewAREntryPage, label: 'New Manual AR Entry', highlight: 'finance/accounts-receivable' },
    'finance/ap/new': { fn: renderNewAPEntryPage, label: 'New Payable', highlight: 'finance/accounts-payable' },
    'finance/expenses/new': { fn: renderNewExpensePage, label: 'New Expense', highlight: 'finance/expenses' },
    'finance/tax/new': { fn: renderNewTaxPage, label: 'New Tax Record', highlight: 'finance/tax' },
  };
  if (financeDynamicRoutes[path]) {
    if (!canAccess('finance')) { renderNoAccess('Finance'); buildBreadcrumb(null, null); return; }
    const route = financeDynamicRoutes[path];
    setActiveNav(route.highlight, NAV.find(n => n.path === 'finance'));
    buildBreadcrumb(NAV.find(n => n.path === 'finance'), { name: route.label });
    route.fn();
    return;
  }
  if (path.startsWith('finance/ar/payment/')) {
    if (!canAccess('finance')) { renderNoAccess('Finance'); buildBreadcrumb(null, null); return; }
    const arId = path.substring('finance/ar/payment/'.length);
    setActiveNav('finance/accounts-receivable', NAV.find(n => n.path === 'finance'));
    buildBreadcrumb(NAV.find(n => n.path === 'finance'), { name: 'Record Payment' });
    renderARPaymentPage(arId);
    return;
  }

  const match = findNavByPath(path);
  if (!match) {
    renderEmptyContent('Page Not Found', 'The page you requested does not exist.');
    buildBreadcrumb(null, null);
    return;
  }

  const { item, child } = match;

  if (!canAccess(item.path)) {
    renderNoAccess(item.name);
    buildBreadcrumb(item, child);
    return;
  }

  setActiveNav(path, item);
  buildBreadcrumb(item, child);

  if (path === 'dashboard') {
    renderDashboard();
    return;
  }

  // Client Orders module — real pages instead of placeholders
  const clientOrderPages = {
    'client-orders/po-monitoring': renderPOMonitoringPage,
    'client-orders/new-po': renderNewClientPOPage,
    'client-orders/open-pos': renderOpenPOsPage,
    'client-orders/delivery-service': renderDeliveryServicePage,
    'client-orders/ready-for-billing': renderReadyForBillingPage,
    'client-orders/po-reports': renderPOReportsPage,
  };
  if (clientOrderPages[path]) {
    clientOrderPages[path]();
    return;
  }

  // Finance module — real pages instead of placeholders
  const financePages = {
    'finance/sales-recognition': renderSalesRecognitionPage,
    'finance/accounts-receivable': renderAccountsReceivablePage,
    'finance/accounts-payable': renderAccountsPayablePage,
    'finance/expenses': renderExpensesPage,
    'finance/general-ledger': renderGeneralLedgerPage,
    'finance/journal-entries': renderJournalEntriesPage,
    'finance/tax': renderTaxPage,
  };
  if (financePages[path]) {
    financePages[path]();
    return;
  }

  const title = child ? child.name : item.name;
  const description = child ? child.description : item.description;
  renderPlaceholderPage(title, description, item.name);
}

function setActiveNav(path, topItem) {
  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
  const link = document.querySelector(`[data-route="${path}"]`);
  if (link) link.classList.add('active');
  // also highlight the group toggle button if this is a top-level-only item (Dashboard)
  if (!topItem.children) {
    const btn = document.querySelector(`[data-nav-toggle="${topItem.path}"]`);
    if (btn) btn.classList.add('active');
  }
  // accordion: expand the group containing the current route, collapse the rest
  document.querySelectorAll('.nav-group').forEach(g => {
    g.classList.toggle('expanded', g.getAttribute('data-nav-key') === topItem.path && !!topItem.children);
  });
}

const PO_COLLECTION = 'clientPOs';
const PO_STATUSES = ['Open', 'Preparing', 'Partial Delivery', 'Complete Delivery', 'Ready for Billing', 'On Hold', 'Cancelled'];
const PO_OPEN_STATUSES = ['Open', 'Preparing'];
const PO_DELIVERY_STATUSES = ['Preparing', 'Partial Delivery', 'Complete Delivery'];
const PO_OPEN_QUICK_STATUSES = ['Open', 'Preparing', 'On Hold', 'Cancelled'];
const PO_DELIVERY_QUICK_STATUSES = ['Preparing', 'Partial Delivery', 'Complete Delivery', 'On Hold', 'Cancelled'];
const PO_TYPES = ['Goods', 'Service', 'Installation'];
const PO_PRIORITIES = ['Normal', 'Urgent'];

function statusBadgeClass(status) {
  const map = {
    'Open': 'bg-blue-50 text-blue-700 border-blue-200',
    'Preparing': 'bg-amber-50 text-amber-700 border-amber-200',
    'Partial Delivery': 'bg-orange-50 text-orange-700 border-orange-200',
    'Complete Delivery': 'bg-teal-50 text-teal-700 border-teal-200',
    'Ready for Billing': 'bg-forest/10 text-forest border-forest/30',
    'On Hold': 'bg-gray-100 text-gray-600 border-gray-300',
    'Cancelled': 'bg-red-50 text-red-600 border-red-200',
  };
  return map[status] || 'bg-gray-50 text-gray-600 border-gray-200';
}
function statusBadge(status) {
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border ${statusBadgeClass(status)}">${status || '—'}</span>`;
}
function formatCurrency(amount) {
  const n = Number(amount) || 0;
  return '₱ ' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDate(value) {
  if (!value) return '—';
  const d = typeof value === 'string' ? new Date(value + 'T00:00:00') : value;
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function calcCommitmentDate(dateReceivedISO, leadTimeValue, leadTimeUnit) {
  if (!dateReceivedISO || !leadTimeValue) return '';
  const days = leadTimeUnit === 'weeks' ? Number(leadTimeValue) * 7 : Number(leadTimeValue);
  if (isNaN(days)) return '';
  const d = new Date(dateReceivedISO + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function isOverdue(po) {
  if (!po.commitmentDeliveryDate) return false;
  if (['Complete Delivery', 'Ready for Billing', 'Cancelled'].includes(po.status)) return false;
  return po.commitmentDeliveryDate < todayISO();
}
function escapeAttr(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

  const span = opts.span2 ? 'sm:col-span-2' : '';
  return `
    <div class="${span}">
      <label class="block text-sm font-medium text-charcoal mb-1.5">${label}</label>
      <textarea id="field-${name}" rows="${opts.rows || 3}" placeholder="${escapeAttr(opts.placeholder)}"
        class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">${opts.value || ''}</textarea>
      ${opts.hint ? `<p class="text-xs text-muted mt-1.5">${opts.hint}</p>` : ''}
    </div>`;
}
function wirePOFormAutoCalc() {
  const recalc = () => {
    const dateReceived = document.getElementById('field-dateReceived')?.value;
    const leadTimeValue = document.getElementById('field-leadTimeValue')?.value;
    const leadTimeUnit = document.getElementById('field-leadTimeUnit')?.value;
    const commitField = document.getElementById('field-commitmentDeliveryDate');
    if (commitField && dateReceived && leadTimeValue) {
      commitField.value = calcCommitmentDate(dateReceived, leadTimeValue, leadTimeUnit);
    }
  };
  ['field-dateReceived', 'field-leadTimeValue', 'field-leadTimeUnit'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', recalc);
  });
}
function readPOFormValues() {
  const val = (id) => { const el = document.getElementById('field-' + id); return el ? el.value.trim() : ''; };
  return {
    clientName: val('clientName'),
    clientPONumber: val('clientPONumber'),
    poType: val('poType'),
    priority: val('priority') || 'Normal',
    projectDescription: val('projectDescription'),
    poAmount: Number(val('poAmount')) || 0,
    dateReceived: val('dateReceived'),
    leadTimeValue: val('leadTimeValue') ? Number(val('leadTimeValue')) : null,
    leadTimeUnit: val('leadTimeUnit') || 'days',
    commitmentDeliveryDate: val('commitmentDeliveryDate'),
    clientContactPerson: val('clientContactPerson'),
    clientContactNumber: val('clientContactNumber'),
    salesPerson: val('salesPerson'),
    paymentTerms: val('paymentTerms'),
    poDocumentReference: val('poDocumentReference'),
    notes: val('notes'),
  };
}

              <td class="px-4 py-3">

      </table>
    </div>`;
}
function wireQuickStatusSelects(onChangeReload) {
  document.querySelectorAll('[data-quick-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const id = sel.getAttribute('data-quick-status');
      const newStatus = sel.value;
      sel.disabled = true;
      try {
        await updateClientPO(id, { status: newStatus });
        await onChangeReload();
      } catch (e) {
        console.error(e);
        alert('Could not update status. Please try again.');
        sel.disabled = false;
      }
    });
  });
}

async function handleCreatePOSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('po-form-submit');
  const btnText = document.getElementById('po-form-submit-text');
  const errBox = document.getElementById('po-form-error');
  errBox.classList.add('hidden');

  const data = readPOFormValues();
  if (!data.clientName || !data.clientPONumber || !data.poType || !data.poAmount || !data.dateReceived) {
    errBox.textContent = 'Please fill in all required fields (marked with *).';
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    data.status = 'Open';
    await createClientPO(data);
    navigateTo('client-orders/open-pos');
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not save this PO. Please check your connection and try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Save Client PO';
  }
}

    const overdueCount = all.filter(isOverdue).length;
    const openValue = all.filter(p => !['Ready for Billing', 'Cancelled'].includes(p.status)).reduce((sum, p) => sum + (Number(p.poAmount) || 0), 0);

    const cards = [
      { label: 'Open POs', value: openCount, icon: 'inbox' },
      { label: 'In Delivery / Preparing', value: inDeliveryCount, icon: 'truck' },
      { label: 'Ready for Billing', value: readyCount, icon: 'check-circle' },

      { label: 'Total Open Value', value: formatCurrency(openValue), icon: 'wallet', wide: true },
    ];

    document.getElementById('po-kpi-container').innerHTML = cards.map(c => `

async function handleUpdatePOSubmit(e, id) {
  e.preventDefault();
  const btn = document.getElementById('po-form-submit');
  const btnText = document.getElementById('po-form-submit-text');
  const errBox = document.getElementById('po-form-error');
  errBox.classList.add('hidden');

  const data = readPOFormValues();
  data.status = document.getElementById('field-status').value;
  data.datesDelivered = document.getElementById('field-datesDelivered').value.trim();
  data.deliveryNotes = document.getElementById('field-deliveryNotes').value.trim();
  data.partialDeliveryDetails = document.getElementById('field-partialDeliveryDetails').value.trim();

  if (!data.clientName || !data.clientPONumber || !data.poType || !data.poAmount || !data.dateReceived) {
    errBox.textContent = 'Please fill in all required fields (marked with *).';
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    await updateClientPO(id, data);
    const dest = PO_OPEN_STATUSES.includes(data.status) ? 'client-orders/open-pos'
      : PO_DELIVERY_STATUSES.includes(data.status) ? 'client-orders/delivery-service'
      : data.status === 'Ready for Billing' ? 'client-orders/ready-for-billing'
      : 'client-orders/po-reports';
    navigateTo(dest);
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not save changes. Please check your connection and try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Save Changes';
  }
}

const ACCOUNTS_CHART = [
  'Cash', 'Accounts Receivable', 'Accounts Payable', 'Sales Revenue',
  'Utilities Expense', 'Rent Expense', 'Salaries Expense', 'Supplies Expense',
  'Transportation Expense', 'Professional Fees Expense', 'Repairs & Maintenance Expense',
  'Taxes & Licenses Expense', 'Miscellaneous Expense',
];
const EXPENSE_ACCOUNTS = ACCOUNTS_CHART.filter(a => a.endsWith('Expense'));
const TAX_TYPES = ['VAT', 'Withholding Tax', 'Percentage Tax'];
const PAYMENT_METHODS = ['Cash', 'Bank Transfer', 'Check', 'Online Payment', 'Other'];

function spinnerHtml() {
  return `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;
}

/* ---- Generic Firestore helpers for Finance collections ---- */
async function createFinanceDoc(collectionName, data) {
  return addDoc(collection(db, collectionName), {
    ...data,
    createdAt: serverTimestamp(),
    createdBy: currentUser ? currentUser.email : null,
  });
}
async function updateFinanceDoc(collectionName, id, data) {
  return updateDoc(doc(db, collectionName, id), {
    ...data,
    updatedAt: serverTimestamp(),
    updatedBy: currentUser ? currentUser.email : null,
  });
}
async function fetchFinanceCollection(collectionName) {
  const snap = await getDocs(query(collection(db, collectionName), orderBy('createdAt', 'desc')));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fetchFinanceDoc(collectionName, id) {
  const snap = await getDoc(doc(db, collectionName, id));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}
async function postGLEntries(entries) {
  for (const entry of entries) {
    await addDoc(collection(db, 'generalLedger'), { ...entry, createdAt: serverTimestamp() });
  }
}

    document.getElementById('sr-eligible-container').innerHTML = eligible.length ? `

        </table>
      </div>` : `<div class="card flex items-center justify-center text-center py-10 text-sm text-muted">No POs currently eligible for recognition.</div>`;

    document.getElementById('sr-recent-container').innerHTML = recognized.length ? `
      <div class="card overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-borderc text-left text-xs text-muted uppercase tracking-wide">
            <th class="px-4 py-3">Client PO #</th><th class="px-4 py-3">Client</th><th class="px-4 py-3">Amount</th><th class="px-4 py-3">Date Recognized</th><th class="px-4 py-3">Recognized By</th>

              <tr class="border-b border-borderc last:border-0">

                <td class="px-4 py-3">${sr.clientName || '—'}</td>
                <td class="px-4 py-3">${formatCurrency(sr.amount)}</td>
                <td class="px-4 py-3">${formatDate(sr.dateRecognized)}</td>
                <td class="px-4 py-3">${sr.recognizedBy || '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `<div class="card flex items-center justify-center text-center py-10 text-sm text-muted">No sales recognized yet.</div>`;

    refreshIcons();

    document.querySelectorAll('[data-recognize]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Recognizing...';
        const poId = btn.getAttribute('data-recognize');
        const amount = Number(btn.getAttribute('data-amount')) || 0;
        const clientName = btn.getAttribute('data-client');
        const clientPONumber = btn.getAttribute('data-pono');
        try {
          const dateRecognized = todayISO();
          const srRef = await createFinanceDoc('salesRecognitions', { poId, clientPONumber, clientName, amount, dateRecognized, recognizedBy: currentUser ? currentUser.email : null });
          await createFinanceDoc('accountsReceivable', {

          console.error(e);
          alert('Could not recognize this sale. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Recognize Sale';
        }
      });
    });
  } catch (e) {
    console.error(e);
    document.getElementById('sr-eligible-container').innerHTML = poLoadErrorHtml();
    document.getElementById('sr-recent-container').innerHTML = '';
  }
}

function addJournalLineRow() {
  const container = document.getElementById('je-lines');

    </div>
    <div class="col-span-2">
      <input type="number" step="0.01" min="0" placeholder="Credit" class="je-credit w-full rounded-md border border-borderc bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest" />
    </div>

    </div>`;
  container.appendChild(row);
  refreshIcons();
  row.querySelector('.je-debit').addEventListener('input', updateJournalTotals);
  row.querySelector('.je-credit').addEventListener('input', updateJournalTotals);
  row.querySelector('.je-remove').addEventListener('click', () => { row.remove(); updateJournalTotals(); });
}
function updateJournalTotals() {
  let totalDebit = 0, totalCredit = 0;
  document.querySelectorAll('#je-lines [data-je-row]').forEach(row => {
    totalDebit += Number(row.querySelector('.je-debit').value) || 0;
    totalCredit += Number(row.querySelector('.je-credit').value) || 0;
  });
  document.getElementById('je-total-debit').textContent = formatCurrency(totalDebit);
  document.getElementById('je-total-credit').textContent = formatCurrency(totalCredit);
}
async function handleJournalEntrySubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('je-form-submit');
  const btnText = document.getElementById('je-form-submit-text');
  const errBox = document.getElementById('je-form-error');
  errBox.classList.add('hidden');

  const date = document.getElementById('field-je-date').value;
  const reference = document.getElementById('field-je-reference').value.trim();
  const lines = [];
  document.querySelectorAll('#je-lines [data-je-row]').forEach(row => {
    const account = row.querySelector('.je-account').value;
    const debit = Number(row.querySelector('.je-debit').value) || 0;
    const credit = Number(row.querySelector('.je-credit').value) || 0;
    if (account && (debit || credit)) lines.push({ account, debit, credit });
  });

  const totalDebit = lines.reduce((s, l) => s + l.debit, 0);
  const totalCredit = lines.reduce((s, l) => s + l.credit, 0);

  if (!date || !reference) {
    errBox.textContent = 'Date and Reference/Description are required.';
    errBox.classList.remove('hidden');
    return;
  }
  if (lines.length < 2) {
    errBox.textContent = 'Add at least two lines.';
    errBox.classList.remove('hidden');
    return;
  }
  if (Math.abs(totalDebit - totalCredit) > 0.01 || totalDebit === 0) {
    errBox.textContent = `Debits (${formatCurrency(totalDebit)}) and Credits (${formatCurrency(totalCredit)}) must balance and be greater than zero.`;
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true; btnText.innerHTML = spinnerHtml();
  try {
    const jeRef = await createFinanceDoc('journalEntries', { date, reference, lines });
    await postGLEntries(lines.map(l => ({ date, account: l.account, debit: l.debit, credit: l.credit, description: reference, sourceType: 'journal-entry', sourceId: jeRef.id })));
    navigateTo('finance/journal-entries');
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not post this journal entry. Please try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false; btnText.textContent = 'Post Journal Entry';
  }
}

      <a href="#/finance/tax/new" class="btn-primary text-sm">+ New Tax Record</a>
    </div>
    <div id="tax-list-container" class="text-sm text-muted">Loading...</div>`);
  refreshIcons();
  try {
    const entries = await fetchFinanceCollection('taxRecords');
    document.getElementById('tax-list-container').innerHTML = taxTableHtml(entries);
    refreshIcons();
    wireTaxMarkPaid();
  } catch (e) {
    console.error(e);
    document.getElementById('tax-list-container').innerHTML = poLoadErrorHtml();
  }
}
async function renderNewTaxPage() {
  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">New Tax Record</h1>
    </div>
    <form id="tax-form" class="card p-6 space-y-4 max-w-2xl">
      <div id="tax-form-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        ${selectField('taxType', 'Tax Type', TAX_TYPES, { required: true })}
        ${textField('period', 'Period', { required: true, placeholder: 'e.g. Q3 2026, September 2026' })}
        ${numberField('taxableAmount', 'Taxable Amount (₱)', { required: true, step: '0.01' })}
        ${numberField('taxAmount', 'Tax Amount (₱)', { required: true, step: '0.01' })}
        ${dateField('dueDate', 'Due Date', { required: true })}
        ${textField('referenceNumber', 'Reference / Form Number')}
        ${textareaField('notes', 'Notes', { span2: true })}
      </div>
      <div class="flex items-center gap-3 pt-2 border-t border-borderc">
        <button id="tax-form-submit" type="submit" class="btn-primary"><span id="tax-form-submit-text">Save Tax Record</span></button>
        <a href="#/finance/tax" class="text-sm text-muted hover:text-charcoal">Cancel</a>
      </div>
    </form>`);
  refreshIcons();
  document.getElementById('tax-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('tax-form-submit');
    const btnText = document.getElementById('tax-form-submit-text');
    const errBox = document.getElementById('tax-form-error');
    errBox.classList.add('hidden');
    const val = (id) => document.getElementById('field-' + id).value.trim();
    const taxType = val('taxType'), period = val('period'), taxableAmount = Number(val('taxableAmount')) || 0, taxAmount = Number(val('taxAmount')) || 0, dueDate = val('dueDate'), referenceNumber = val('referenceNumber'), notes = val('notes');
    if (!taxType || !period || !taxAmount || !dueDate) {
      errBox.textContent = 'Please fill in all required fields.';
      errBox.classList.remove('hidden');
      return;
    }
    btn.disabled = true; btnText.innerHTML = spinnerHtml();
    try {
      await createFinanceDoc('taxRecords', { taxType, period, taxableAmount, taxAmount, dueDate, referenceNumber, notes, filingStatus: 'Pending' });
      navigateTo('finance/tax');
    } catch (err) {
      console.error(err);
      errBox.textContent = 'Could not save this tax record. Please try again.';
      errBox.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Save Tax Record';
    }
  });
}

/* ---- General Ledger ---- */
async function renderGeneralLedgerPage() {
  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">General Ledger</h1>
      <p class="text-sm text-muted mt-1">Consolidated postings from Sales Recognition, Accounts Receivable payments, Accounts Payable, Expenses, and Journal Entries.</p>
    </div>
    <div class="flex flex-wrap gap-3 mb-4">
      <input id="gl-search" type="text" placeholder="Search description..." class="flex-1 min-w-[220px] rounded-md border border-borderc bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest" />
      <select id="gl-account" class="rounded-md border border-borderc bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">
        <option value="">All Accounts</option>
        ${ACCOUNTS_CHART.map(a => `<option value="${a}">${a}</option>`).join('')}
      </select>
    </div>
    <div id="gl-totals" class="text-sm text-muted mb-3"></div>
    <div id="gl-list-container" class="text-sm text-muted">Loading...</div>`);
  refreshIcons();

  let allEntries = [];
  try {
    allEntries = await fetchFinanceCollection('generalLedger');
  } catch (e) {
    console.error(e);
    document.getElementById('gl-list-container').innerHTML = poLoadErrorHtml();
    return;
  }

  const renderFiltered = () => {
    const search = document.getElementById('gl-search').value.trim().toLowerCase();
    const account = document.getElementById('gl-account').value;
    const filtered = allEntries.filter(g => {
      const matchesSearch = !search || (g.description || '').toLowerCase().includes(search);
      const matchesAccount = !account || g.account === account;
      return matchesSearch && matchesAccount;
    });
    const totalDebit = filtered.reduce((s, g) => s + (Number(g.debit) || 0), 0);
    const totalCredit = filtered.reduce((s, g) => s + (Number(g.credit) || 0), 0);
    document.getElementById('gl-totals').innerHTML = `Showing ${filtered.length} entries · Total Debit: <span class="font-medium text-charcoal">${formatCurrency(totalDebit)}</span> · Total Credit: <span class="font-medium text-charcoal">${formatCurrency(totalCredit)}</span>`;

    document.getElementById('gl-list-container').innerHTML = filtered.length ? `
      <div class="card overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-borderc text-left text-xs text-muted uppercase tracking-wide">
            <th class="px-4 py-3">Date</th><th class="px-4 py-3">Account</th><th class="px-4 py-3">Description</th><th class="px-4 py-3 text-right">Debit</th><th class="px-4 py-3 text-right">Credit</th>
          </tr></thead>
          <tbody>
            ${filtered.map(g => `
              <tr class="border-b border-borderc last:border-0 hover:bg-cream/50">
                <td class="px-4 py-3">${formatDate(g.date)}</td>
                <td class="px-4 py-3 font-medium text-charcoal">${g.account}</td>
                <td class="px-4 py-3">${g.description || '—'}</td>
                <td class="px-4 py-3 text-right">${g.debit ? formatCurrency(g.debit) : ''}</td>
                <td class="px-4 py-3 text-right">${g.credit ? formatCurrency(g.credit) : ''}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `<div class="card flex items-center justify-center text-center py-16 text-sm text-muted">No entries match your filters.</div>`;
  };

  renderFiltered();
  document.getElementById('gl-search').addEventListener('input', renderFiltered);
  document.getElementById('gl-account').addEventListener('change', renderFiltered);
}

/* ==========================================================================
   AUTH BOOTSTRAP
   ========================================================================== */
async function isFirstAccount() {
  try {
    const existing = await getDocs(query(collection(db, 'users'), limit(1)));
    return existing.empty;
  } catch (e) {
    console.warn('Could not check for existing users, defaulting role to finance_staff.', e);
    return false;
  }
}

async function ensureUserProfile(user) {
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    return snap.data();
  }

  // Reached only if a profile doc wasn't already created at sign-up time
  // (e.g. an account created directly in the Firebase console). Same
  // first-account-becomes-admin rule applies here too.
  const isFirstUser = await isFirstAccount();
  const profile = {
    name: user.email.split('@')[0],
    email: user.email,
    role: isFirstUser ? 'super_admin' : 'finance_staff',
    department: isFirstUser ? 'Administration' : 'Finance',
    isActive: true,
    createdAt: serverTimestamp(),
  };
  await setDoc(ref, profile);
  return profile;
}

function initRouter() {
  window.addEventListener('hashchange', renderRoute);
  if (!window.location.hash) window.location.hash = '#/dashboard';
  renderRoute();
}

async function bootstrap() {
  if (!firebaseReady) {
    renderLogin();
    return;
  }
  renderLoading();
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      try {
        currentProfile = await ensureUserProfile(user);
      } catch (e) {
        console.error('Could not load/create user profile:', e);
        currentProfile = { name: user.email, email: user.email, role: 'finance_staff', department: 'Finance', isActive: true };
      }
      renderShell();
      initRouter();
    } else {
      currentUser = null;
      currentProfile = null;
      renderLogin();
    }
  });
}

bootstrap();
</script>
