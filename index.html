/* ==========================================================================

   ==========================================================================

   (see firestore.rules), not from hiding this object.
*/
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",

};

let firebaseReady = false;
try {

// Future modules - registry only, NOT shown in sidebar until enabled: true
const STANDBY_MODULES = {
  projects:   { name: "Projects & Installation", icon: "hard-hat",       enabled: false },

  workOrders: { name: "Work Orders",              icon: "clipboard-list",enabled: false },

  payroll:    { name: "Payroll",                  icon: "users",         enabled: false },
  contracts:  { name: "Contract Management",      icon: "file-signature",enabled: false },
  logistics:  { name: "Logistics",                icon: "truck",         enabled: false },
  analytics:  { name: "Business Analytics",       icon: "trending-up",   enabled: false },
};

// role -> which top-level module paths are visible
const ROLE_PERMISSIONS = {
  super_admin:     { finance:true, billing:true, procurement:true, reports:true, documents:true, administration:true, settings:true },
  finance_manager: { finance:true, billing:true, procurement:true, reports:true, documents:true, administration:false, settings:false },
  finance_staff:   { finance:true, billing:true, procurement:false, reports:true, documents:true, administration:false, settings:false },
  admin:           { finance:false, billing:false, procurement:false, reports:false, documents:true, administration:true, settings:true },
  management:      { finance:true, billing:true, procurement:true, reports:true, documents:true, administration:true, settings:false },
};

let currentUser = null;
let currentProfile = null;

/* ==========================================================================
   HELPERS
   ========================================================================== */
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function icon(name, cls = "w-5 h-5") {
  return `<i data-lucide="${name}" class="${cls}"></i>`;
}
function refreshIcons() { if (window.lucide) lucide.createIcons(); }
function findNavByPath(path) {
  for (const item of NAV) {
    if (item.path === path) return { item, child: null };
    if (item.children) {
      const child = item.children.find(c => c.path === path);
      if (child) return { item, child };
    }
  }
  return null;
}
function canAccess(topPath) {
  if (!currentProfile) return true;
  const perms = ROLE_PERMISSIONS[currentProfile.role] || {};
  return perms[topPath] !== false;
}

/* ==========================================================================
   RENDER: ROOT SHELLS
   ========================================================================== */
const root = document.getElementById('root');

function renderLoading() {
  root.innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-cream">
      <div class="flex flex-col items-center gap-3 text-muted">
        <div class="w-8 h-8 border-2 border-forest border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm">Loading ${APP_NAME}...</p>
      </div>
    </div>`;
}

function renderLogin(errorMsg = "") {
  root.innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-cream px-4">
      <div class="w-full max-w-md">
        <div class="bg-white border border-borderc rounded-xl shadow-card p-8 fade-in">
          <div class="flex flex-col items-center mb-6">
            <div class="w-14 h-14 rounded-lg bg-forest flex items-center justify-center mb-4">
              <span class="text-cream font-bold text-xl">M</span>
            </div>
            <h1 class="text-lg font-semibold text-charcoal text-center">${APP_NAME}</h1>
            <p class="text-sm text-muted mt-1">Sign in to continue</p>
          </div>

          ${!firebaseReady ? `
            <div class="mb-4 text-sm bg-amber-50 border border-amber-200 text-amber-800 rounded-md px-3 py-2">
              Firebase is not configured yet. Add your project keys to the <code class="font-mono">firebaseConfig</code> object near the top of this file.
            </div>` : ''}

          <form id="login-form" class="space-y-4">
            <div id="login-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>

            <div>
              <label class="block text-sm font-medium text-charcoal mb-1.5">Email</label>
              <input id="login-email" type="email" required autocomplete="username"
                class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest"
                placeholder="you@mechatrade.com" />
            </div>

            <div>
              <label class="block text-sm font-medium text-charcoal mb-1.5">Password</label>
              <div class="relative">
                <input id="login-password" type="password" required autocomplete="current-password"
                  class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest"
                  placeholder="••••••••" />
                <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-charcoal">
                  ${icon('eye', 'w-4 h-4')}
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between text-sm">
              <label class="flex items-center gap-2 text-muted cursor-pointer select-none">
                <input id="login-remember" type="checkbox" class="rounded border-borderc text-forest focus:ring-forest" />
                Remember me
              </label>
              <button type="button" id="forgot-link" class="text-forest hover:underline">Forgot password?</button>
            </div>

            <button id="login-submit" type="submit" class="w-full inline-flex items-center justify-center rounded-md bg-forest px-4 py-2.5 text-sm font-medium text-white hover:bg-forest-dark transition-colors disabled:opacity-60">
              <span id="login-submit-text">Sign In</span>
            </button>
          </form>
        </div>
        <p class="text-center text-xs text-muted mt-6">${COMPANY_NAME}</p>
      </div>
    </div>`;

  refreshIcons();

  const pwInput = document.getElementById('login-password');
  document.getElementById('toggle-password').addEventListener('click', () => {
    pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    refreshIcons();
  });

  document.getElementById('forgot-link').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    if (!email) { showLoginError('Enter your email above first, then click "Forgot password?" again.'); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      showLoginError('Password reset email sent. Check your inbox.', true);
    } catch (e) {
      showLoginError(friendlyAuthError(e));
    }
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const remember = document.getElementById('login-remember').checked;
    const btn = document.getElementById('login-submit');
    const btnText = document.getElementById('login-submit-text');

    if (!firebaseReady) { showLoginError('Firebase is not configured. See the firebaseConfig object near the top of this file.'); return; }

    btn.disabled = true;
    btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

    try {
      await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
      await signInWithEmailAndPassword(auth, email, password);
      // onAuthStateChanged will take over rendering
    } catch (err) {
      showLoginError(friendlyAuthError(err));
      btn.disabled = false;
      btnText.textContent = 'Sign In';
    }
  });
}

function showLoginError(msg, isSuccess = false) {
  const box = document.getElementById('login-error');
  if (!box) return;
  box.textContent = msg;
  box.classList.remove('hidden');
  if (isSuccess) {
    box.classList.remove('bg-red-50','border-red-200','text-red-700');
    box.classList.add('bg-green-50','border-green-200','text-green-700');
  }
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : '';
  const map = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-disabled': 'This account has been disabled.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Please wait and try again.',
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

function sidebarHtml() {

    const visible = canAccess(item.path);

    const hasChildren = !!item.children;
    return `

        <button class="nav-link w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-md text-sm font-medium text-cream/90 hover:bg-white/10 transition-colors" data-nav-toggle="${item.path}">
          <span class="flex items-center gap-2.5">
            ${icon(item.icon, 'w-[18px] h-[18px]')}
            ${item.name}
          </span>
          ${hasChildren ? icon('chevron-down', 'w-4 h-4 nav-chevron transition-transform') : ''}
        </button>
        ${hasChildren ? `
          <div class="nav-children pl-9 space-y-0.5 mt-0.5 overflow-hidden" data-nav-children="${item.path}">
            ${item.children.map(c => `
              <a href="#/${c.path}" data-route="${c.path}"
                 class="nav-link block px-3 py-2 rounded-md text-[13px] text-cream/70 hover:text-cream hover:bg-white/10 transition-colors">
                ${c.name}
              </a>`).join('')}
          </div>` : ''}
      </div>`;
  }).join('');

  return `
    <aside id="sidebar" class="fixed lg:static z-40 inset-y-0 left-0 w-64 bg-forest flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
      <div class="flex items-center gap-2.5 px-4 h-16 border-b border-white/10 shrink-0">

          <span class="text-forest font-bold">M</span>
        </div>
        <div class="min-w-0">
          <p class="text-cream text-sm font-semibold leading-tight truncate">Mechatrade</p>
          <p class="text-cream/60 text-[11px] leading-tight">Finance Management System</p>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto px-2 py-3 space-y-1">${items}</nav>

      <div class="border-t border-white/10 p-3">
        <button id="sidebar-profile-btn" class="w-full flex items-center gap-2.5 px-2 py-2 rounded-md hover:bg-white/10 transition-colors text-left">
          <div class="w-8 h-8 rounded-full bg-cream/90 flex items-center justify-center text-forest text-xs font-semibold shrink-0" id="sidebar-avatar">?</div>
          <div class="min-w-0 flex-1">

}

            <button class="w-full text-left px-3 py-2 text-sm text-charcoal hover:bg-cream flex items-center gap-2" data-route="settings/general">${icon('settings','w-4 h-4')} Account Settings</button>
            <div class="h-px bg-borderc my-1"></div>
            <button id="header-signout" class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">${icon('log-out','w-4 h-4')} Sign Out</button>
          </div>
        </div>
      </div>
    </header>`;
}

function renderShell() {
  root.innerHTML = `
    <div class="min-h-screen flex bg-cream">
      ${sidebarHtml()}
      <div class="flex-1 min-w-0 flex flex-col">
        ${headerHtml()}
        <main id="content" class="flex-1 overflow-y-auto p-4 lg:p-6"></main>
      </div>
    </div>`;
  refreshIcons();
  wireShellEvents();
  applyUserToChrome();
}

function applyUserToChrome() {
  const name = (currentProfile && currentProfile.name) || (currentUser && currentUser.email) || 'User';
  const role = currentProfile ? roleLabel(currentProfile.role) : '—';
  const initials = name.split(' ').map(p => p[0]).filter(Boolean).slice(0,2).join('').toUpperCase() || '?';
  ['sidebar-username','header-username'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = name; });
  ['sidebar-userrole','header-userrole'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = role; });
  ['sidebar-avatar','header-avatar'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = initials; });
}

function roleLabel(role) {
  const map = {
    super_admin: 'Super Admin', finance_manager: 'Finance Manager', finance_staff: 'Finance Staff',
    admin: 'Admin', management: 'Management'
  };
  return map[role] || role || '—';
}

function wireShellEvents() {
  document.getElementById('sidebar-toggle')?.addEventListener('click', () => toggleSidebar(true));
  document.getElementById('sidebar-backdrop')?.addEventListener('click', () => toggleSidebar(false));

  document.getElementById('sidebar-signout')?.addEventListener('click', handleSignOut);
  document.getElementById('header-signout')?.addEventListener('click', handleSignOut);

  document.getElementById('header-profile-btn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('header-profile-menu')?.classList.toggle('hidden');
  });
  document.addEventListener('click', () => document.getElementById('header-profile-menu')?.classList.add('hidden'));

  document.querySelectorAll('[data-nav-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-nav-toggle');
      const item = NAV.find(n => n.path === key);
      if (item && item.children) {
        navigateTo(item.children[0].path);
      } else {
        navigateTo(key);
      }
    });
  });

  document.querySelectorAll('[data-route]').forEach(n => {
    n.addEventListener('click', (e) => {
      e.preventDefault();
      navigateTo(n.getAttribute('data-route'));
    });
  });
}

function toggleSidebar(open) {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (!sb || !bd) return;
  sb.classList.toggle('-translate-x-full', !open);
  bd.classList.toggle('hidden', !open);
}

async function handleSignOut() {
  try { await signOut(auth); } catch (e) { console.error(e); }
}

/* ==========================================================================
   ROUTING + PAGE CONTENT
   ========================================================================== */
function navigateTo(path) {
  window.location.hash = `#/${path}`;
}

function currentPathFromHash() {
  const h = window.location.hash || '#/dashboard';
  return h.replace(/^#\//, '') || 'dashboard';
}

function buildBreadcrumb(topItem, childItem) {
  const parts = [];
  if (topItem) parts.push(topItem.name);
  if (childItem && childItem.name !== (topItem && topItem.name)) parts.push(childItem.name);
  const bc = document.getElementById('breadcrumb');
  if (bc) bc.innerHTML = parts.map((p, i) =>
    `<span class="${i === parts.length - 1 ? 'text-charcoal font-medium' : ''}">${p}</span>`
  ).join(' <span class="text-borderc">/</span> ');
}

function renderRoute() {
  if (!currentUser) return; // guarded elsewhere
  const path = currentPathFromHash();

  // Standby / future module check (not in NAV, reached only via config)
  const standbyKey = Object.keys(STANDBY_MODULES).find(k => path === `future/${k}`);
  if (standbyKey) {
    renderModuleNotAvailable(STANDBY_MODULES[standbyKey].name);
    return;
  }

  const match = findNavByPath(path);
  if (!match) {
    renderEmptyContent('Page Not Found', 'The page you requested does not exist.');
    buildBreadcrumb(null, null);
    return;
  }

  const { item, child } = match;

  if (!canAccess(item.path)) {
    renderNoAccess(item.name);
    buildBreadcrumb(item, child);
    return;
  }

  setActiveNav(path, item);
  buildBreadcrumb(item, child);

  if (path === 'dashboard') {
    renderDashboard();
    return;
  }

  const title = child ? child.name : item.name;
  const description = child ? child.description : item.description;
  renderPlaceholderPage(title, description, item.name);
}

function setActiveNav(path, topItem) {
  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
  const link = document.querySelector(`[data-route="${path}"]`);
  if (link) link.classList.add('active');
  // also highlight the group toggle button if this is a top-level-only item (Dashboard)
  if (!topItem.children) {
    const btn = document.querySelector(`[data-nav-toggle="${topItem.path}"]`);
    if (btn) btn.classList.add('active');
  } else {
    // expand the group containing this route
    const group = document.querySelector(`[data-nav-children="${topItem.path}"]`);
    if (group) group.style.maxHeight = group.scrollHeight + 'px';
  }
}

function contentWrap(inner) {
  const c = document.getElementById('content');
  if (c) c.innerHTML = `<div class="fade-in max-w-6xl">${inner}</div>`;
}

function renderDashboard() {

    { label: 'Accounts Receivable', value: '₱ 1,972,450', icon: 'arrow-down-to-line', tone: 'text-charcoal' },
    { label: 'Accounts Payable', value: '₱ 863,120', icon: 'arrow-up-from-line', tone: 'text-charcoal' },
    { label: 'Current Month Revenue', value: '₱ 3,104,880', icon: 'trending-up', tone: 'text-forest' },
    { label: 'Pending Approvals', value: '12', icon: 'clock', tone: 'text-charcoal' },

    { label: 'Outstanding Invoices', value: '34', icon: 'receipt', tone: 'text-charcoal' },

  contentWrap(`

      ${cards.map(c => `

    </div>

      <div class="flex items-center gap-3 text-muted">
        ${icon('info', 'w-5 h-5 shrink-0')}

      </div>

}

function renderPlaceholderPage(title, description, sectionName) {

        ${icon('hammer', 'w-6 h-6')}
      </div>

function renderModuleNotAvailable(name) {
  contentWrap(`
    <div class="min-h-[60vh] flex flex-col items-center justify-center text-center">
      <div class="w-16 h-16 rounded-full bg-cream flex items-center justify-center text-forest mb-5">
        ${icon('lock', 'w-7 h-7')}
      </div>

        ${icon('arrow-left', 'w-4 h-4')} Back to Dashboard

  contentWrap(`
    <div class="min-h-[60vh] flex flex-col items-center justify-center text-center">

  contentWrap(`
    <div class="min-h-[60vh] flex flex-col items-center justify-center text-center">
      <h1 class="text-lg font-semibold text-charcoal">${title}</h1>

      <a href="#/dashboard" class="mt-6 inline-flex items-center gap-2 rounded-md bg-forest px-4 py-2.5 text-sm font-medium text-white hover:bg-forest-dark">Back to Dashboard</a>
    </div>`);
}

/* ==========================================================================
   AUTH BOOTSTRAP
   ========================================================================== */
async function ensureUserProfile(user) {
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    return snap.data();
  }

  // First-time sign-in: figure out if this is the very first account ever
  // created in this Firebase project. If the users collection is empty,
  // this account becomes the system admin (full access to every module).
  // Every account after that defaults to finance_staff — adjust roles
  // manually in Firestore (or via Settings > Users & Roles once that
  // module is built) as needed.
  let isFirstUser = false;
  try {
    const existing = await getDocs(query(collection(db, 'users'), limit(1)));
    isFirstUser = existing.empty;
  } catch (e) {
    console.warn('Could not check for existing users, defaulting role to finance_staff.', e);
  }

  const profile = {
    name: user.email.split('@')[0],
    email: user.email,
    role: isFirstUser ? 'super_admin' : 'finance_staff',
    department: isFirstUser ? 'Administration' : 'Finance',
    isActive: true,
    createdAt: serverTimestamp(),
  };
  await setDoc(ref, profile);
  return profile;
}

function initRouter() {
  window.addEventListener('hashchange', renderRoute);
  if (!window.location.hash) window.location.hash = '#/dashboard';
  renderRoute();
}

async function bootstrap() {
  if (!firebaseReady) {
    renderLogin();
    return;
  }
  renderLoading();
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      try {
        currentProfile = await ensureUserProfile(user);
      } catch (e) {
        console.error('Could not load/create user profile:', e);
        currentProfile = { name: user.email, email: user.email, role: 'finance_staff', department: 'Finance', isActive: true };
      }
      renderShell();
      initRouter();
    } else {
      currentUser = null;
      currentProfile = null;
      renderLogin();
    }
  });
}

bootstrap();
</script>
